    handleExcelFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const buffer = e.target.result;
          const workbook = XLSX.read(buffer, { type: 'array' });
          const sheetName = workbook.SheetNames[0];
          const rawSheet = workbook.Sheets[sheetName];
          const rawRows = XLSX.utils.sheet_to_json(rawSheet, { header: 1 });

          if (!rawRows || rawRows.length === 0) {
            this.showToast("Uploaded Excel file appears to be empty.", "error");
            return;
          }

          // Smart detection: determine if Row 1 is a header or already student #1
          let startIndex = 0;
          let regCol = -1, nameCol = -1, rollCol = -1, deptCol = -1;

          const firstRow = rawRows[0] || [];
          const firstRowStr = firstRow.map(c => String(c || '').toLowerCase().replace(/[^a-z]/g, ''));
          const isHeader = firstRowStr.some(s => s.includes('reg') || s.includes('admission') || s.includes('name') || s.includes('student') || s.includes('roll') || s.includes('slno'));

          if (isHeader) {
            startIndex = 1;
            firstRow.forEach((col, idx) => {
              const clean = String(col || '').toLowerCase().replace(/[^a-z]/g, '');
              if (regCol === -1 && (clean.includes('reg') || clean.includes('admission') || clean.includes('candidatecode'))) regCol = idx;
              else if (nameCol === -1 && (clean.includes('name') || clean.includes('student'))) nameCol = idx;
              else if (rollCol === -1 && clean.includes('roll')) rollCol = idx;
              else if (deptCol === -1 && (clean.includes('dept') || clean.includes('department') || clean.includes('branch') || clean.includes('major'))) deptCol = idx;
            });
          }

          // Positional fallbacks if columns not named explicitly
          if (regCol === -1) regCol = 0;
          if (nameCol === -1) nameCol = 1;
          if (rollCol === -1 && firstRow.length > 2) rollCol = 2;

          const students = [];
          for (let i = startIndex; i < rawRows.length; i++) {
            const r = rawRows[i];
            if (!r || r.length === 0) continue;
            const regNo = r[regCol] !== undefined && r[regCol] !== null ? String(r[regCol]).trim() : '';
            const name = r[nameCol] !== undefined && r[nameCol] !== null ? String(r[nameCol]).trim() : '';
            let rollNo = rollCol !== -1 && r[rollCol] !== undefined && r[rollCol] !== null ? String(r[rollCol]).trim() : '';
            if (rollNo.endsWith('.0')) rollNo = rollNo.slice(0, -2);
            const department = deptCol !== -1 && r[deptCol] !== undefined && r[deptCol] !== null ? String(r[deptCol]).trim() : '';

            if (regNo && name) {
              students.push({
                regNo: regNo,
                name: name,
                rollNo: rollNo,
                department: department
              });
            }
          }

          if (students.length === 0) {
            this.showToast("Could not detect 'Reg No' and 'Name' columns in Excel.", "error");
            return;
          }

          this.state.parsedImportStudents = students;

          // Render Preview Table
          document.getElementById('import-preview-count').textContent = students.length;
          const tbody = document.getElementById('import-preview-table-body');
          let html = '';
          students.slice(0, 100).forEach(s => {
            html += `
            <tr class="hover:bg-slate-50">
              <td class="px-3 py-1.5 font-mono">${s.regNo}</td>
              <td class="px-3 py-1.5 font-semibold text-slate-800">${s.name}</td>
              <td class="px-3 py-1.5 text-slate-500">${s.rollNo || '-'}</td>
              <td class="px-3 py-1.5 text-xs text-purple-700">${s.department ? `<span class="bg-purple-50 px-1.5 py-0.5 rounded border border-purple-200 font-medium">${s.department}</span>` : '<span class="text-slate-300">-</span>'}</td>
            </tr>
          `;
          });
          tbody.innerHTML = html;
          document.getElementById('import-preview-container').classList.remove('hidden');
          this.showToast(`Parsed ${students.length} students from Excel.`, 'success');

        } catch (err) {
          this.showToast(`Failed to parse Excel: ${err}`, "error");
        }
      };
      reader.readAsArrayBuffer(file);
    },

    loadRosterForManager(classId) {
      if (!classId) return;
      const listContainer = document.getElementById('roster-manager-list');
      const countBadge = document.getElementById('roster-manager-count');
      const cachedRosters = this.getCachedRosters() || {};
      const cachedMeta = this.getCachedMetadata();
      const fallbackStudents = cachedRosters[classId] || (cachedMeta && cachedMeta.allRosters && cachedMeta.allRosters[classId]) || null;

      if (!navigator.onLine && Array.isArray(fallbackStudents)) {
        this.state.rosterStudents = fallbackStudents;
        if (countBadge) countBadge.textContent = `${this.state.rosterStudents.length} students (Offline Cache)`;
        this.renderRosterManagerTable();
        return;
      }

      listContainer.innerHTML = `<div class="p-8 text-center text-blue-600 font-medium text-xs sm:text-sm">Loading class roster...</div>`;
      if (countBadge) countBadge.textContent = 'Loading...';

      google.script.run
        .withSuccessHandler(students => {
          this.state.rosterStudents = students || [];
          const activeOnly = this.state.rosterStudents.filter(s => !s.isInactive);
          const rosters = this.getCachedRosters() || {};
          rosters[classId] = activeOnly;
          this.setCachedRosters(rosters);
          const cachedMeta = this.getCachedMetadata();
          if (cachedMeta && cachedMeta.allRosters) {
            cachedMeta.allRosters[classId] = activeOnly;
            this.setCachedMetadata(cachedMeta);
          }
          if (countBadge) countBadge.textContent = `${this.state.rosterStudents.length} students`;
          this.renderRosterManagerTable();
        })
        .withFailureHandler(err => {
          if (Array.isArray(fallbackStudents)) {
            this.state.rosterStudents = fallbackStudents;
            if (countBadge) countBadge.textContent = `${this.state.rosterStudents.length} students (Offline Cache)`;
            this.renderRosterManagerTable();
            this.showToast("Offline: Showing cached student list.", "warning");
          } else {
            listContainer.innerHTML = `<div class="p-6 text-center text-rose-500 text-xs">Error loading roster: ${err}</div>`;
          }
        })
        .getStudentsByClass(classId, true);
    },

    exportRosterForBulkEdit() {

        return;
      }

      const classObj = this.state.classes.find(c => c.classId === classId);
      const className = classObj ? classObj.className : classId;

      const exportRows = students.map(s => ({
        "Student Key (Do Not Change)": s.studentId || s.regNo,
        "Register No": s.regNo,
        "Student Name": s.name,
        "Roll No": s.rollNo || "",
        "Home Department": s.department || ""
      }));

      const ws = XLSX.utils.json_to_sheet(exportRows);
      ws['!cols'] = [
        { wch: 22 },
        { wch: 18 },
        { wch: 30 },
        { wch: 10 },
        { wch: 20 }
      ];

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Class Roster");

      const cleanFileName = className.replace(/[^a-zA-Z0-9_-]/g, '_');
      const fileName = `${cleanFileName}_Bulk_Edit_Roster.xlsx`;

    handleBulkUpdateFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const buffer = e.target.result;
          const workbook = XLSX.read(buffer, { type: 'array' });
          const sheetName = workbook.SheetNames[0];
          const rawJson = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);

          if (!rawJson || rawJson.length === 0) {
            this.showToast("Uploaded Excel file appears to be empty.", "error");
            return;
          }

          const existingStudents = this.state.rosterStudents || [];
          const existingKeyMap = new Map();
          const existingRegMap = new Map();
          existingStudents.forEach(s => {
            const key = s.studentId || s.regNo;
            existingKeyMap.set(key, s);
            if (s.regNo) existingRegMap.set(s.regNo.toUpperCase(), s);
          });

          const parsedList = [];
          let regNoChangedCount = 0;

          rawJson.forEach(row => {
            let studentKey = '';
            let regNo = '';
            let name = '';
            let rollNo = '';
            let department = '';

            Object.keys(row).forEach(k => {
              const cleanK = k.toLowerCase().replace(/[^a-z]/g, '');
              if (cleanK.includes('key') || cleanK.includes('studentid') || cleanK.includes('systemkey')) {
                studentKey = row[k];
              } else if (cleanK.includes('reg') || cleanK.includes('admission') || cleanK.includes('candidatecode')) {
                regNo = row[k];
              } else if (cleanK.includes('name') || cleanK.includes('student')) {
                name = row[k];
              } else if (cleanK.includes('roll')) {
                rollNo = row[k];
              } else if (cleanK.includes('dept') || cleanK.includes('department') || cleanK.includes('branch') || cleanK.includes('major')) {
                department = row[k];
              }
            });

            if (!regNo && Object.values(row)[1]) regNo = Object.values(row)[1];
            if (!name && Object.values(row)[2]) name = Object.values(row)[2];

            if (regNo && name) {
              const cleanKey = studentKey ? studentKey.toString().trim() : '';
              const cleanReg = regNo.toString().trim().toUpperCase();
              const cleanName = name.toString().trim();
              const cleanRoll = rollNo ? rollNo.toString().trim() : '';
              const cleanDept = department ? department.toString().trim() : '';

              const matchedStudent = existingKeyMap.get(cleanKey) || existingRegMap.get(cleanReg);
              const oldRegNo = matchedStudent ? matchedStudent.regNo : cleanReg;
              if (oldRegNo && oldRegNo !== cleanReg) {
                regNoChangedCount++;
              }

              parsedList.push({
                studentKey: cleanKey || (matchedStudent ? matchedStudent.studentId : ''),
                regNo: cleanReg,
                name: cleanName,
                rollNo: cleanRoll,
                department: cleanDept,
                oldRegNo: oldRegNo
              });
            }
          });

          if (parsedList.length === 0) {
            this.showToast("Could not parse student rows. Ensure 'Register No' and 'Student Name' columns exist.", "error");
            return;
          }

          this.state.parsedBulkStudents = parsedList;

          document.getElementById('bulk-preview-count').textContent = parsedList.length;
          document.getElementById('bulk-change-summary').textContent = `${regNoChangedCount} Register Number changes detected`;

          const tbody = document.getElementById('bulk-preview-tbody');
          let html = '';
          parsedList.forEach(s => {
            const isChanged = s.oldRegNo && s.oldRegNo !== s.regNo;
            const regCellClass = isChanged ? 'bg-amber-50 text-amber-900 font-bold' : 'text-slate-600';
            html += `
              <tr class="hover:bg-slate-50">
                <td class="px-3 py-1.5 font-mono text-slate-500">${s.oldRegNo || '-'}</td>
                <td class="px-3 py-1.5 font-mono ${regCellClass}">
                  ${s.regNo} ${isChanged ? '⚡' : ''}
                </td>
                <td class="px-3 py-1.5 font-semibold text-slate-800">${s.name}</td>
                <td class="px-3 py-1.5 text-slate-500 font-mono">${s.rollNo || '-'}</td>
                <td class="px-3 py-1.5 text-slate-600 text-[11px]">${s.department || '-'}</td>
              </tr>
            `;
          });
          tbody.innerHTML = html;

          document.getElementById('bulk-preview-container').classList.remove('hidden');
          document.getElementById('commit-bulk-update-btn').disabled = false;
          this.showToast(`Parsed ${parsedList.length} students. Review changes and click Apply!`, "info");

        } catch (err) {
          this.showToast(`Error reading Excel file: ${err}`, "error");
        }
      };
      reader.readAsArrayBuffer(file);
    },

      const newRegNo = document.getElementById('edit-student-reg').value.trim().toUpperCase();
      const newName = document.getElementById('edit-student-name').value.trim();
      const newRollNo = document.getElementById('edit-student-roll').value.trim();
      const deptInput = document.getElementById('edit-student-dept');
      const newDepartment = deptInput ? deptInput.value.trim() : '';

      if (!studentId || !newRegNo || !newName) {
        this.showToast("Register Number and Student Name are required.", "error");
        return;
      }

      const btn = document.getElementById('save-student-btn');
      btn.disabled = true;
      btn.innerHTML = `<span>Saving...</span>`;

      google.script.run
        .withSuccessHandler(res => {
          btn.disabled = false;
          btn.innerHTML = `<span>Save Changes</span>`;
          if (res.success) {
            this.showToast(res.message, "success");
            this.closeEditStudentModal();

            // Update in-memory collections seamlessly
            const updateRecord = s => {
              if ((s.studentId && s.studentId === studentId) || s.regNo === studentId || s.regNo === newRegNo) {
                s.regNo = newRegNo;
                s.name = newName;
                s.rollNo = newRollNo;
                s.department = newDepartment;
              }
            };

            if (this.state.students) this.state.students.forEach(updateRecord);
            if (this.state.editStudents) this.state.editStudents.forEach(updateRecord);
            if (this.state.rosterStudents) this.state.rosterStudents.forEach(updateRecord);
            if (this.state.promoteStudents) this.state.promoteStudents.forEach(updateRecord);
            const cachedRosters = this.getCachedRosters() || {};
            Object.keys(cachedRosters).forEach(cid => {
              if (Array.isArray(cachedRosters[cid])) cachedRosters[cid].forEach(updateRecord);
            });
            this.setCachedRosters(cachedRosters);

            // Re-render whichever tables are currently mounted
            if (this.state.currentTab === 'mark') {
              this.renderMarkStudentTable();

            if (this.state.currentTab === 'edit') {
              const searchVal = document.getElementById('roster-manager-search') ? document.getElementById('roster-manager-search').value : '';

              this.renderPromotionStudentList(searchVal);
            }
          } else {
            this.showToast(res.message, "error");
          }
        })
        .withFailureHandler(err => {
          btn.disabled = false;
          btn.innerHTML = `<span>Save Changes</span>`;
          this.showToast(`Error saving student details: ${err}`, "error");
        })
        .updateStudentDetails(studentId, newRegNo, newName, newRollNo, newDepartment, this.getAuthToken());

    renderPeriodScheduleEditor() {

    savePeriodSchedule() {
      const regRows = document.querySelectorAll('#regular-periods-list .period-row');
      const friRows = document.querySelectorAll('#friday-periods-list .period-row');

      const regular = [];
      regRows.forEach(r => {
        const name = (r.querySelector('.period-name-input').value || '').trim();
        const startTime = r.querySelector('.period-start-input').value;
        const endTime = r.querySelector('.period-end-input').value;
        if (name && startTime && endTime) {
          regular.push({ name, startTime, endTime });
        }
      });

      const friday = [];
      friRows.forEach(r => {
        const name = (r.querySelector('.period-name-input').value || '').trim();
        const startTime = r.querySelector('.period-start-input').value;
        const endTime = r.querySelector('.period-end-input').value;
        if (name && startTime && endTime) {
          friday.push({ name, startTime, endTime });
        }
      });

      if (regular.length === 0) {
        this.showToast("Please define at least one period for regular timetable.", "error");
        return;
      }

      const periodSchedule = {
        regular,
        friday: friday.length > 0 ? friday : regular
      };

      const btn = document.getElementById('save-period-schedule-btn');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span>Saving...</span>';
      }

      const collegeName = (this.state.config && this.state.config.collegeName) || 'Attendance App';
      const portalTitle = (this.state.config && this.state.config.portalTitle) || 'Department Attendance Management';
      const minAttendance = (this.state.config && this.state.config.minAttendance) || 75;

      google.script.run
        .withSuccessHandler(res => {
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = `
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
              </svg>
              <span>Save Schedule</span>
            `;
          }
          if (res && res.success) {
            this.state.config.periodSchedule = periodSchedule;
            // Update local cache so it works offline immediately
            const cached = this.getCachedMetadata() || {};
            cached.config = cached.config || {};
            cached.config.periodSchedule = periodSchedule;
            this.setCachedMetadata(cached);

            // Re-render Period options in Mark tab
            const curDate = document.getElementById('mark-date-input') ? document.getElementById('mark-date-input').value : '';
            this.renderPeriodOptions(curDate, true);
            this.showToast("🎉 Period Timetable Schedule saved successfully!", "success");
          } else {
            this.showToast((res && res.message) || "Error saving schedule.", "error");
          }
        })
        .withFailureHandler(err => {
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = '<span>Save Schedule</span>';
          }
          this.showToast(`Error saving period schedule: ${err}`, "error");
        })
        .updateAppConfig({
          collegeName,
          portalTitle,
          minAttendance,
          periodSchedule,
          authToken: this.getAuthToken()
        }, this.getAuthToken());
    },

    resetPeriodScheduleToDefault() {
      if (confirm("Reset timetable schedule to standard college timings (Period 1 to Period 5, including special Friday timings)?")) {
        this.state.config.periodSchedule = JSON.parse(JSON.stringify(DEFAULT_PERIOD_SCHEDULE));
        this.renderPeriodScheduleEditor();
        this.savePeriodSchedule();
      }

    onPromoteSourceClassChange(classId) {
      if (!classId) return;

      const targetInput = document.getElementById('promote-target-name');
      const sourceObj = this.state.classes.find(c => c.classId === classId);
      if (sourceObj && targetInput) {
        // Intelligently suggest next semester (e.g. S1 -> S2, S3 -> S4, S5 -> S6)
        const name = sourceObj.className;
        const semMatch = name.match(/S(\d+)/i);
        if (semMatch) {
          const nextSem = parseInt(semMatch[1], 10) + 1;
          targetInput.value = name.replace(/S\d+/i, `S${nextSem}`);
        } else {
          targetInput.value = `${name} (Promoted)`;
        }
      }

      const emptyState = document.getElementById('promote-empty-state');
      const wrapper = document.getElementById('promote-selection-wrapper');
      const listContainer = document.getElementById('promote-students-list');
      const badge = document.getElementById('promote-selection-badge');
      if (emptyState) emptyState.classList.add('hidden');
      if (wrapper) wrapper.classList.remove('hidden');
      if (badge) badge.textContent = `Loading students for ${sourceObj ? sourceObj.className : classId}...`;
      listContainer.innerHTML = '<div class="p-6 text-center text-xs text-blue-600 font-medium">Loading student roster...</div>';

      google.script.run
        .withSuccessHandler(students => {
          this.state.promoteStudents = students || [];
          if (badge) badge.textContent = `${this.state.promoteStudents.length} students enrolled`;
          this.renderPromotionStudentList();
        })
        .withFailureHandler(err => {
          listContainer.innerHTML = `<div class="p-4 text-center text-xs text-rose-500">Error loading students: ${err}</div>`;
        })
        .getStudentsByClass(classId);
    },

    renderPromotionStudentList(filter = '') {
      const listContainer = document.getElementById('promote-students-list');
      const allStudents = this.state.promoteStudents || [];
      const cleanFilter = filter.toLowerCase().trim();

      const students = cleanFilter
        ? allStudents.filter(s => (s.name || '').toLowerCase().includes(cleanFilter) || (s.regNo || '').toLowerCase().includes(cleanFilter) || (s.rollNo || '').toString().includes(cleanFilter))
        : allStudents;

      if (students.length === 0) {
        listContainer.innerHTML = '<div class="p-6 text-center text-xs text-slate-400">No students match the search criteria.</div>';
        return;
      }

      document.getElementById('promote-total-count').textContent = allStudents.length;

      let html = '';
      students.forEach((s) => {
        const studentId = s.studentId || s.regNo;
        html += `
          <label class="promote-student-item flex items-center justify-between p-2.5 rounded-lg hover:bg-slate-50 cursor-pointer transition text-xs border border-transparent hover:border-slate-200 gap-2 w-full overflow-hidden">
            <div class="flex items-center space-x-2 min-w-0 flex-1">
              <input type="checkbox" class="promote-student-checkbox w-4 h-4 rounded text-blue-600 focus:ring-blue-500 flex-shrink-0"
                value="${studentId}" checked onchange="app.updatePromotionSelectedCount()">
              <span class="font-mono font-bold text-slate-900 bg-slate-100 px-1.5 py-0.5 rounded border border-slate-200 text-[11px] flex-shrink-0">${s.regNo}</span>
              <span class="text-slate-800 font-medium truncate">${s.name}</span>
            </div>
            <span class="text-slate-500 font-mono text-[11px] bg-slate-50 px-2 py-0.5 rounded flex-shrink-0">#${s.rollNo || '-'}</span>
          </label>
        `;
      });
      listContainer.innerHTML = html;
      this.updatePromotionSelectedCount();
    },

    executeBatchPromotion() {
      const sourceClassId = document.getElementById('promote-source-class').value;
      const targetClassName = document.getElementById('promote-target-name').value.trim();
      const archiveSourceClass = document.getElementById('promote-archive-source').checked;

      if (!sourceClassId) {
        this.showToast("Please select a source class.", "error");
        return;
      }
      if (!targetClassName) {
        this.showToast("Please enter a target class name (e.g. S2 FYUGP Botany).", "error");
        return;
      }

      const checkboxes = document.querySelectorAll('.promote-student-checkbox:checked');
      const studentIds = Array.from(checkboxes).map(cb => cb.value);

      if (studentIds.length === 0) {
        this.showToast("Please select at least one student to promote.", "error");
        return;
      }

      const sourceObj = this.state.classes.find(c => c.classId === sourceClassId);
      const sourceName = sourceObj ? sourceObj.className : sourceClassId;

      const confirmMsg = `Promote ${studentIds.length} student(s) from "${sourceName}" to "${targetClassName}"?\n\n` +
        `• Historical attendance for "${sourceName}" will remain 100% frozen and intact.\n` +
        (archiveSourceClass ? `• Source class "${sourceName}" will be archived from daily marking.` : `• Source class will remain active.`);

      if (!confirm(confirmMsg)) return;

      const btn = document.getElementById('promote-submit-btn');
      btn.disabled = true;
      btn.innerHTML = `<span>Promoting...</span>`;

      google.script.run
        .withSuccessHandler(res => {
          btn.disabled = false;
          btn.innerHTML = `
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
            </svg>
            <span>Execute Batch Promotion</span>
          `;
          if (res.success) {
            this.showToast(res.message, "success");
            // Refresh metadata to update all class selectors
            google.script.run
              .withSuccessHandler(data => {
                this.onMetadataLoaded(data);
                const emptyState = document.getElementById('promote-empty-state');
                const wrapper = document.getElementById('promote-selection-wrapper');
                const badge = document.getElementById('promote-selection-badge');
                if (emptyState) emptyState.classList.remove('hidden');
                if (wrapper) wrapper.classList.add('hidden');
                if (badge) badge.textContent = "Select source class above";
                document.getElementById('promote-target-name').value = '';
                document.getElementById('promote-source-class').value = '';

              .getAppMetadata(this.getAuthToken());
          } else {
            this.showToast(res.message, "error");
          }
        })
        .withFailureHandler(err => {
          btn.disabled = false;
          btn.innerHTML = `<span>Execute Batch Promotion</span>`;
          this.showToast(`Promotion error: ${err}`, "error");
        })
        .promoteBatch({
          sourceClassId,
          targetClassName,
          studentIds,
          archiveSourceClass,
          authToken: this.getAuthToken()
        }, this.getAuthToken());
    },

    /* ==========================================================
       OFFLINE QUEUE & LOCALSTORAGE SYNCHRONIZATION ENGINE
       ========================================================== */

    getOfflineQueue() {
      try {
        const raw = localStorage.getItem('attendance_offline_queue');
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        console.error('Error reading offline queue:', e);
        return [];
      }
    },

    setOfflineQueue(queue) {
      try {
        localStorage.setItem('attendance_offline_queue', JSON.stringify(queue || []));
        this.updateOfflineUI();
      } catch (e) {
        console.error('Error writing offline queue:', e);
      }
    },

    saveSessionToOfflineQueue(sessionPayload) {
      const queue = this.getOfflineQueue();
      const queueId = `OFFLINE_${sessionPayload.classId}_${sessionPayload.date}_${(sessionPayload.period || '').replace(/\s+/g, '')}`;
      sessionPayload.queueId = queueId;
      sessionPayload.savedAt = new Date().toISOString();
      sessionPayload.facultyEmail = (this.state.currentUser && this.state.currentUser.email) || '';

      const c = (this.state.classes || []).find(cls => cls.classId === sessionPayload.classId);
      sessionPayload.className = c ? c.className : sessionPayload.classId;

      const existingIdx = queue.findIndex(q => q.queueId === queueId);
      if (existingIdx >= 0) {
        queue[existingIdx] = sessionPayload;
      } else {
        queue.push(sessionPayload);
      }

      this.setOfflineQueue(queue);

      const pCount = (sessionPayload.records || []).filter(r => r.status === 'P' || r.status === 'L').length;
      const aCount = (sessionPayload.records || []).filter(r => r.status === 'A').length;

      this.showToast(`💾 Saved to Local Offline Queue! (${pCount} Present, ${aCount} Absent). Stored safely on this phone.`, 'success');
      this.onMarkParameterChange();
    },

    syncOfflineQueue() {
      const queue = this.getOfflineQueue();
      if (!queue || queue.length === 0) {
        this.showToast("Offline queue is empty. No sessions pending sync.", "info");
        return;
      }

      if (!navigator.onLine) {
        this.showToast("Cannot sync: No internet connection detected. Please connect to WiFi or Mobile Data.", "error");
        return;
      }

      const syncBtn = document.getElementById('offline-sync-all-btn');
      const quickBtn = document.getElementById('offline-quick-sync-btn');
      if (syncBtn) {
        syncBtn.disabled = true;
        syncBtn.innerHTML = `<span>Syncing ${queue.length} session(s)...</span>`;
      }
      if (quickBtn) {
        quickBtn.classList.add('animate-spin');
      }

      this.showToast(`Syncing ${queue.length} offline attendance session(s) to Google Sheets...`, "info");

      google.script.run
        .withSuccessHandler(res => {
          if (syncBtn) {
            syncBtn.disabled = false;
            syncBtn.innerHTML = `<span>Sync All to Sheets</span>`;
          }
          if (quickBtn) {
            quickBtn.classList.remove('animate-spin');
          }

          if (res && res.success) {
            // Find which items succeeded and clear them from queue
            const successQueueIds = new Set((res.results || []).filter(r => r.success).map(r => r.queueId));
            const remainingQueue = queue.filter(q => !successQueueIds.has(q.queueId));
            this.setOfflineQueue(remainingQueue);

            this.showToast(`🎉 Success: ${res.syncedCount} offline session(s) synchronized to Google Sheets!`, "success");
            this.renderOfflineQueueList();
            this.onMarkParameterChange();

            if (remainingQueue.length === 0) {
              this.closeOfflineQueueModal();
            }
          } else {
            this.showToast(res ? res.message : "Sync error occurred.", "error");
          }
        })
        .withFailureHandler(err => {
          if (syncBtn) {
            syncBtn.disabled = false;
            syncBtn.innerHTML = `<span>Sync All to Sheets</span>`;
          }
          if (quickBtn) {
            quickBtn.classList.remove('animate-spin');
          }
          this.showToast(`Sync network failure: ${err}`, "error");
        })
        .syncOfflineSessionsBatch(queue, this.getAuthToken());
    },

    handleNetworkStatusChange(isOnline) {
      this.updateOfflineUI();
      if (isOnline) {
        this.showToast("🌐 Internet connection restored!", "success");
        // Auto-sync if queue has items!
        const queue = this.getOfflineQueue();
        if (queue.length > 0) {
          this.syncOfflineQueue();
        }
      } else {
        this.showToast("⚡ Internet connection lost. Switched to Offline Mode.", "warning");
      }
      this.onMarkParameterChange();
    },

    updateOfflineUI() {
      const isOnline = navigator.onLine;
      const queue = this.getOfflineQueue();
      const queueCount = queue.length;

      const pill = document.getElementById('offline-sync-pill');
      const countText = document.getElementById('offline-queue-count-text');
      const badgeBtn = document.getElementById('offline-badge-btn');
      const banner = document.getElementById('offline-banner');
      const bannerText = document.getElementById('offline-banner-text');

      if (pill) {
        if (!isOnline || queueCount > 0) {
          pill.classList.remove('hidden');
          if (countText) {
            countText.textContent = isOnline ? `Sync (${queueCount})` : `Offline (${queueCount})`;
          }
          if (badgeBtn) {
            badgeBtn.className = isOnline
              ? "px-2.5 py-1 text-[11px] font-bold rounded-full bg-emerald-100 text-emerald-800 border border-emerald-300 flex items-center space-x-1.5 hover:bg-emerald-200 transition shadow-sm cursor-pointer"
              : "px-2.5 py-1 text-[11px] font-bold rounded-full bg-amber-100 text-amber-800 border border-amber-300 flex items-center space-x-1.5 hover:bg-amber-200 transition shadow-sm cursor-pointer";
          }
        } else {
          pill.classList.add('hidden');
        }
      }

      if (banner && !this.state.dismissedOfflineBanner) {
        if (!isOnline) {
          banner.classList.remove('hidden');
          banner.className = "bg-amber-500 text-white text-xs font-semibold px-4 py-2 flex items-center justify-between shadow-inner";
          if (bannerText) {
            bannerText.textContent = queueCount > 0
              ? `Working Offline (${queueCount} session(s) pending sync). Data is safely saved on this device.`
              : 'Working Offline. Attendance will be saved to this device and synced when you reconnect.';
          }
        } else if (queueCount > 0) {
          banner.classList.remove('hidden');
          banner.className = "bg-indigo-600 text-white text-xs font-semibold px-4 py-2 flex items-center justify-between shadow-inner";
          if (bannerText) {
            bannerText.textContent = `Online with ${queueCount} attendance session(s) pending sync.`;
          }
        } else {
          banner.classList.add('hidden');
        }
      }

      const markSelect = document.getElementById('mark-class-select');
      if (!markSelect || !markSelect.value) {
        this.updateMarkUnselectedStatus();
      }
      this.renderOfflineQueueList();
    },

    dismissOfflineBanner() {
      this.state.dismissedOfflineBanner = true;
      const banner = document.getElementById('offline-banner');
      if (banner) banner.classList.add('hidden');
    },

    openOfflineQueueModal() {
      this.renderOfflineQueueList();
      const modal = document.getElementById('offline-queue-modal');
      if (modal) modal.classList.remove('hidden');
    },

    closeOfflineQueueModal() {
      const modal = document.getElementById('offline-queue-modal');
      if (modal) modal.classList.add('hidden');
    },

    renderOfflineQueueList() {
      const container = document.getElementById('offline-queue-list-container');
      const summary = document.getElementById('offline-queue-modal-summary');
      const syncAllBtn = document.getElementById('offline-sync-all-btn');
      if (!container) return;

      const queue = this.getOfflineQueue();
      if (summary) {
        summary.textContent = `${queue.length} session(s) pending sync`;
      }
      if (syncAllBtn) {
        syncAllBtn.disabled = queue.length === 0;
      }

      if (queue.length === 0) {
        container.innerHTML = `
          <div class="text-center py-8 text-slate-400">
            <div class="text-3xl mb-2">🎉</div>
            <div class="text-xs font-semibold text-slate-600">All attendance records are synchronized!</div>
            <div class="text-[11px] text-slate-400 mt-1">New sessions marked while offline will appear here.</div>
          </div>
        `;
        return;
      }

      let html = '';
      queue.forEach((item, idx) => {
        const pCount = (item.records || []).filter(r => r.status === 'P' || r.status === 'L').length;
        const aCount = (item.records || []).filter(r => r.status === 'A').length;
        const timeStr = item.savedAt ? new Date(item.savedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

        html += `
          <div class="bg-white border border-slate-200 rounded-xl p-3.5 shadow-sm space-y-2">
            <div class="flex items-start justify-between gap-2">
              <div>
                <div class="flex items-center space-x-1.5 flex-wrap">
                  <span class="font-bold text-slate-900 text-xs sm:text-sm">${item.className || item.classId}</span>
                  <span class="px-2 py-0.5 text-[10px] font-extrabold rounded bg-blue-100 text-blue-700">${item.period}</span>
                </div>
                <div class="text-[11px] text-slate-500 mt-0.5">
                  Date: <strong class="text-slate-700">${item.date}</strong> ${item.subject ? `• Subject: ${item.subject}` : ''}
                </div>
              </div>
              <button onclick="app.removeOfflineQueueItem('${item.queueId}')" title="Discard this session"
                class="text-slate-400 hover:text-rose-600 text-xs p-1 transition">
                🗑️
              </button>
            </div>
            <div class="flex items-center justify-between text-[11px] pt-1.5 border-t border-slate-100">
              <div class="flex items-center space-x-3">
                <span class="text-emerald-700 font-bold">Present: ${pCount}</span>
                <span class="text-rose-700 font-bold">Absent: ${aCount}</span>
                <span class="text-slate-400">Total: ${item.records.length}</span>
              </div>
              <span class="text-[10px] text-slate-400">Saved: ${timeStr}</span>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    },

    removeOfflineQueueItem(queueId) {
      if (!confirm("Are you sure you want to discard this queued offline session?")) return;
      const queue = this.getOfflineQueue().filter(q => q.queueId !== queueId);
      this.setOfflineQueue(queue);
      this.renderOfflineQueueList();
      this.onMarkParameterChange();
      this.showToast("Removed session from offline queue.", "info");
    },

    getCachedMetadata() {
      try {
        const raw = localStorage.getItem('attendance_cached_metadata');
        return raw ? JSON.parse(raw) : null;
      } catch (e) { return null; }
    },

    setCachedMetadata(data) {
      try {
        localStorage.setItem('attendance_cached_metadata', JSON.stringify(data));
      } catch (e) { }
    },

    getCachedRosters() {
      try {
        const raw = localStorage.getItem('attendance_cached_rosters');
        return raw ? JSON.parse(raw) : {};
      } catch (e) { return {}; }
    },

    setCachedRosters(rosters) {
      try {
        localStorage.setItem('attendance_cached_rosters', JSON.stringify(rosters || {}));
      } catch (e) { }
    },

    /**
     * Signs out from this browser and clears locally saved authentication.
     * Allows switching Google accounts or re-authenticating from scratch.
     */
    signOutBrowser() {
      if (confirm("Sign out of this browser? Saved credentials will be removed from this device, and you will need to authenticate again next time.")) {
        this.clearCachedAuth();
        this.showToast("Signed out. Resetting browser session...", "info");
        setTimeout(() => {
          window.location.reload();
        }, 400);
      }
    },

    /** Clears all locally cached authentication and data from this browser */
    clearCachedAuth() {
      try {
        localStorage.removeItem('attendance_cached_metadata');
        localStorage.removeItem('attendance_cached_rosters');
        localStorage.removeItem('attendance_class');
        localStorage.removeItem('attendance_auth_token');
      } catch (e) { }
    },

    getAuthToken() {
      try {
        return localStorage.getItem('attendance_auth_token') || '';
      } catch (e) { return ''; }
    },

    setAuthToken(token) {
      try {
        if (token) localStorage.setItem('attendance_auth_token', token);
        else localStorage.removeItem('attendance_auth_token');
      } catch (e) {}
    },

    /**
     * Initializes Google Identity Services (GIS) for 1-click Google Sign-In.
     */
    initGoogleSignIn() {
      // In Google Apps Script, the app runs inside a sandboxed iframe (*.googleusercontent.com)
      // where Google Accounts are handled natively by Apps Script container auth.
      // Google Identity Services (GSI) button is only for external hosting (GitHub Pages / Vercel).
      const isGasHost = window.location.hostname.includes('googleusercontent.com') || window.location.hostname.includes('script.google.com');
      const googleSection = document.getElementById('google-signin-section');
      if (isGasHost) {
        if (googleSection) googleSection.classList.add('hidden');
        return;
      }
      if (googleSection) googleSection.classList.remove('hidden');

      const clientId = "886464904597-pdp0mhb3kcb3dnt0pn7sosupgfc3frch.apps.googleusercontent.com";
      
      const checkGis = () => {
        if (typeof google !== 'undefined' && google.accounts && google.accounts.id) {
          try {
            google.accounts.id.initialize({
              client_id: clientId,
              callback: (response) => this.handleGoogleCredentialResponse(response),
              auto_select: false,
              cancel_on_tap_outside: true
            });

            const btnContainer = document.getElementById('g_id_signin_btn');
            if (btnContainer) {
              btnContainer.innerHTML = ''; // prevent duplicate buttons
              google.accounts.id.renderButton(btnContainer, {
                theme: "outline",
                size: "large",
                type: "standard",
                shape: "pill",
                text: "signin_with",
                logo_alignment: "left",
                width: 260
              });
            }
          } catch (e) {
            console.warn("GIS initialization error:", e);
          }
        } else {
          setTimeout(checkGis, 200);
        }
      };

      checkGis();
    },

    /**
     * Callback when user selects account in Google Identity Services.
     * @param {Object} response - { credential, select_by }
     */
    handleGoogleCredentialResponse(response) {
      if (!response || !response.credential) {
        this.showToast("Google sign-in was cancelled or failed.", "error");
        return;
      }

      try {
        const token = response.credential;
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
        const payload = JSON.parse(jsonPayload);
        const email = payload.email ? payload.email.toLowerCase().trim() : '';

        if (!email) {
          this.showToast("Could not retrieve email from Google credential.", "error");
          return;
        }

        this.showToast("Authenticating Google account: " + email + "...", "info");

        google.script.run
          .withSuccessHandler(res => {
            if (res && res.success) {
              this.onAuthSuccess(res);
            } else {
              this.showUnauthorizedScreen({
                email: email,
                message: res ? res.message : "Account not registered in faculty roster."
              });
              this.showToast(res ? res.message : "Authorization denied.", "error");
            }
          })
          .withFailureHandler(err => {
            this.showToast("Error verifying Google account with server: " + err, "error");
          })
          .verifyGoogleLogin(email, token);

      } catch (err) {
        console.error("JWT parse error:", err);
        this.showToast("Failed to process Google login response: " + err.message, "error");
      }
    },

    verifyEmergencyPassword() {
      const emailInput = document.getElementById('emergency-email-input');
      const pwdInput = document.getElementById('emergency-password-input');
      const email = emailInput ? emailInput.value.trim() : '';
      const password = pwdInput ? pwdInput.value.trim() : '';

      if (!email || !email.includes('@')) {
        this.showToast("Please enter your registered college email address.", "error");
        return;
      }
      if (!password) {
        this.showToast("Please enter the Emergency Password.", "error");
        return;
      }

      const btn = document.getElementById('verify-emergency-pwd-btn');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span class="animate-spin inline-block mr-1">⏳</span> Verifying...';
      }

      google.script.run
        .withSuccessHandler(res => {
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = '<span>🔑 Log In with Emergency Password</span>';
          }
          if (res.success) {
            this.onAuthSuccess(res);
          } else {
            this.showToast(res.message, 'error');
          }
        })
        .withFailureHandler(err => {
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = '<span>🔑 Log In with Emergency Password</span>';
          }
          this.showToast("Verification error: " + err, "error");
        })
        .verifyEmergencyPassword(email, password);
    },

    requestEmailOTP() {
      const emailInput = document.getElementById('emergency-email-input');
      const email = emailInput ? emailInput.value.trim() : '';
      if (!email || !email.includes('@')) {
        this.showToast("Please enter a valid department email address.", "error");
        return;
      }

      const btn = document.getElementById('send-otp-btn');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span class="animate-spin inline-block mr-1">⏳</span> Sending OTP...';
      }

      google.script.run
        .withSuccessHandler(res => {
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = '<span>📧 Resend Code</span>';
          }
          if (res.success) {
            this.showToast(res.message, 'success');
            const verifyBlock = document.getElementById('otp-verify-block');
            if (verifyBlock) verifyBlock.classList.remove('hidden');
            const otpInput = document.getElementById('emergency-otp-input');
            if (otpInput) {
              otpInput.value = '';
              otpInput.focus();
            }
          } else {
            this.showToast(res.message, 'error');
          }
        })
        .withFailureHandler(err => {
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = '<span>📧 Send One-Time OTP</span>';
          }
          this.showToast("Error requesting OTP: " + err, "error");
        })
        .sendLoginOTP(email);
    },

    verifyEmailOTP() {
      const emailInput = document.getElementById('emergency-email-input');
      const otpInput = document.getElementById('emergency-otp-input');
      const email = emailInput ? emailInput.value.trim() : '';
      const otp = otpInput ? otpInput.value.trim() : '';

      if (!email || !otp) {
        this.showToast("Please enter both your email and the 6-digit OTP code.", "error");
        return;
      }

      const btn = document.getElementById('verify-otp-btn');
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Verifying...';
      }

      google.script.run
        .withSuccessHandler(res => {
          if (btn) {
            btn.disabled = false;
            btn.textContent = 'Verify & Enter';
          }
          if (res.success) {
            this.onAuthSuccess(res);
          } else {
            this.showToast(res.message, 'error');
          }
        })
        .withFailureHandler(err => {
          if (btn) {
            btn.disabled = false;
            btn.textContent = 'Verify & Enter';
          }
          this.showToast("Error verifying OTP: " + err, "error");
        })
        .verifyLoginOTP(email, otp);
    },

    onAuthSuccess(res) {
      if (res && res.success && res.user) {
        if (res.authToken) this.setAuthToken(res.authToken);
        if (res.metadata) {
          this.setCachedMetadata(res.metadata);
          if (res.metadata.allRosters) {
            this.setCachedRosters(res.metadata.allRosters);
          }
          this.onMetadataLoaded(res.metadata, false);
        } else {
          this.loadAppMetadata();
        }
        this.showToast(res.message || `Welcome, ${res.user.name}!`, 'success');
        const deniedView = document.getElementById('access-denied-view');
        if (deniedView) deniedView.classList.add('hidden');
      }
    },

    syncDrivePermissions() {
      const btn = document.getElementById('sync-drive-btn');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span>⏳ Syncing...</span>';
      }
      this.showToast("Syncing Google Drive permissions for all registered faculty...", "info");

      google.script.run
        .withSuccessHandler(res => {
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = '<span>🔄 Sync Drive Permissions</span>';
          }
          if (res && res.success) {
            this.showToast(res.message || "Drive permissions synced!", "success");
          } else {
            this.showToast(res ? res.message : "Failed to sync permissions.", "error");
          }
        })
        .withFailureHandler(err => {
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = '<span>🔄 Sync Drive Permissions</span>';
          }
          this.showToast("Error syncing Drive permissions: " + err, "error");
        })
        .syncDrivePermissions(this.getAuthToken());
    },

    runDiagnostics(preferredEmail) {
      const emailInput = document.getElementById('emergency-email-input');
      const email = preferredEmail || (emailInput ? emailInput.value.trim() : '');

      const clientInfo = {
        userAgent: navigator.userAgent,
        cookiesEnabled: navigator.cookieEnabled,
        online: navigator.onLine,
        windowLocation: window.location.href,
        hasLocalStorageToken: Boolean(this.getAuthToken()),
        cachedUserEmail: (this.getCachedMetadata() && this.getCachedMetadata().user) ? this.getCachedMetadata().user.email : null,
        email: email
      };

      console.info("🔍 System Diagnostics Client Info:", clientInfo);

      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        console.warn("⚠️ Google Apps Script client API not available in this window.");
        return;
      }

      google.script.run
        .withSuccessHandler(diag => {
          this.lastDiagnostics = diag;
          console.group("🛠️ [SYSTEM DIAGNOSTICS & SESSION INSPECTOR]");
          console.log("Timestamp:", diag.timestamp);
          console.log("Session:", diag.session);
          console.log("Spreadsheet:", diag.spreadsheet);
          console.log("Users Sheet:", diag.usersSheet);
          console.log("Cache:", diag.cache);
          console.log("Resolution:", diag.resolution);
          console.log("Full Report:", diag);
          console.groupEnd();
        })
        .withFailureHandler(err => {
          console.error("❌ System diagnostics failed:", err);
        })
        .getAuthDiagnostics(clientInfo);
    },

    clearCacheAndReload() {
      try {
        localStorage.clear();
        sessionStorage.clear();
      } catch (e) {}
      window.location.reload(true);
    },

    /* ==========================================================
       GLOBAL TOAST NOTIFICATION UTILITY
       ========================================================== */

    showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');

      let bg = 'bg-slate-900 text-white';
      if (type === 'success') bg = 'bg-emerald-600 text-white';
      if (type === 'error') bg = 'bg-rose-600 text-white';
      if (type === 'info') bg = 'bg-blue-600 text-white';

      toast.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-xl text-xs sm:text-sm font-semibold flex items-center space-x-2 transition transform duration-200 ease-out -translate-y-2 opacity-0 ${bg}`;
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);

      // Animate in
      requestAnimationFrame(() => {
        toast.classList.remove('-translate-y-2', 'opacity-0');
      });

      // Auto dismiss after 3.5 seconds
      setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2');
        setTimeout(() => toast.remove(), 250);
      }, 3500);
    }
  };

  window.addEventListener('DOMContentLoaded', () => {
    app.init();
  });
</script>
