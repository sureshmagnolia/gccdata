<script>
  /**
   * ATTENDANCE APP
   * File: ClientScript.html
   * Description: Client-side single-page application controller, SheetJS integration, and mobile-friendly UI state.
   */

  // ==========================================================
  // UNIVERSAL API ADAPTER FOR VERCEL & GITHUB PAGES HOSTING
  // If hosted outside Google Apps Script, polyfills google.script.run
  // via HTTP fetch to the Google Apps Script Web App REST API.
  // ==========================================================
  const APPS_SCRIPT_API_URL = "https://script.google.com/macros/s/AKfycby4lmDThLFyDtPyZvWBIox4jk6Q1JNz3Q5ztWPJd-XyB1N8-OWjR0hPzdSE3_4uWzKc/exec";

  if (typeof google === 'undefined' || !google.script || !google.script.run) {
    window.google = window.google || {};
    window.google.script = window.google.script || {};
    window.google.script.run = {
      _successHandler: null,
      _failureHandler: null,
      withSuccessHandler(fn) {
        const runner = Object.create(this);
        runner._successHandler = fn;
        return runner;
      },
      withFailureHandler(fn) {
        const runner = Object.create(this);
        runner._failureHandler = fn;
        return runner;
      }
    };

    const apiMethods = [
      'getAppMetadata', 'recordAttendanceSession', 'verifyGoogleLogin', 'verifyEmergencyPassword', 'sendLoginOTP',
      'verifyLoginOTP', 'getSessionForEditing', 'getAttendanceReport', 'downloadRegisterPdf',
      'syncOfflineSessionsBatch', 'getStudentsByClass', 'getCurrentUserEmail', 'getAuthDiagnostics',
      'syncDrivePermissions', 'getUsersList', 'addUser', 'setUserStatus', 'deleteUser',
      'updateAppConfig', 'addNewStudent', 'updateStudentDetails', 'reactivateStudent',
      'removeStudent', 'bulkUpdateStudentRoster', 'importClassRoster', 'promoteBatch',
      'clearClassAttendanceData'
    ];

    apiMethods.forEach(method => {
      window.google.script.run[method] = function(...args) {
        const success = this._successHandler;
        const failure = this._failureHandler;
        
        const token = (typeof app !== 'undefined' && typeof app.getAuthToken === 'function')
          ? app.getAuthToken()
          : '';
        const payload = {
          action: method,
          args: args,
          authToken: token
        };

        const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
        const heavyMethods = new Set([
          'getAttendanceReport', 'downloadRegisterPdf', 'syncOfflineSessionsBatch',
          'importClassRoster', 'promoteBatch', 'clearClassAttendanceData', 'bulkUpdateStudentRoster'
        ]);
        const timeoutMs = heavyMethods.has(method) ? 45000 : 15000;
        const timerId = controller ? setTimeout(() => controller.abort(), timeoutMs) : null;

        fetch(APPS_SCRIPT_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload),
          signal: controller ? controller.signal : undefined
        })
        .then(res => {
          if (timerId) clearTimeout(timerId);
          if (!res.ok) throw new Error("Server returned HTTP " + res.status);
          return res.json();
        })
        .then(data => {
          if (success) success(data);
        })
        .catch(err => {
          if (timerId) clearTimeout(timerId);
          console.warn("API request failed (" + method + "):", err);
          if (failure) failure(err);
        });
      };
    });
  }

  // Default Period Timings Schedule (Fallback & Initial Preset)
  const DEFAULT_PERIOD_SCHEDULE = {
    regular: [
      { name: "Period 1", startTime: "10:00", endTime: "11:00" },
      { name: "Period 2", startTime: "11:00", endTime: "12:00" },
      { name: "Period 3", startTime: "12:00", endTime: "13:00" },
      { name: "Period 4", startTime: "14:00", endTime: "15:00" },
      { name: "Period 5", startTime: "15:00", endTime: "16:00" }
    ],
    friday: [
      { name: "Period 1", startTime: "09:30", endTime: "10:30" },
      { name: "Period 2", startTime: "10:30", endTime: "11:30" },
      { name: "Period 3", startTime: "11:30", endTime: "12:30" },
      { name: "Period 4", startTime: "14:00", endTime: "15:00" },
      { name: "Period 5", startTime: "15:00", endTime: "16:00" }
    ]
  };

  const app = {
    // Global Application State
    state: {
      currentUser: null,
      classes: [],
      faculty: [],
      config: {},
      periodSchedule: null,
      manualPeriodSelected: false,
      scheduleActiveTab: 'regular',
      currentTab: 'mark',
      activeSessionKey: '',
      isExistingSession: false,
      existingSession: null,
      students: [],
      attendanceRecords: {}, // regNo -> status (P/A/L)
      editStudents: [],
      editRecords: {},
      editSession: null,
      activeReportData: null,
      parsedImportStudents: [],
      rosterStudents: [],
      parsedBulkStudents: []
    },

    /** Initializes the client application */
    init() {
      // Ensure date is always today on load in local timezone (YYYY-MM-DD)
      const today = new Date().toLocaleDateString('en-CA');
      const dateInput = document.getElementById('mark-date-input');
      const reportToDate = document.getElementById('report-to-date');
      const reportFromDate = document.getElementById('report-from-date');

      if (dateInput) {
        dateInput.value = today;
        this.updateDateDisplay(today);
      }
      if (reportToDate) reportToDate.value = today;
      if (reportFromDate && !reportFromDate.value) {
        const d = new Date();
        d.setDate(1); // Default to first day of current month
        reportFromDate.value = d.toLocaleDateString('en-CA');
      }

      // Initial period options and real-time clock ticker
      this.renderPeriodOptions(today, true);
      this.startPeriodClock();

      // Bind Online / Offline Network Listeners for Auto-Sync
      window.addEventListener('online', () => this.handleNetworkStatusChange(true));
      window.addEventListener('offline', () => this.handleNetworkStatusChange(false));
      this.updateOfflineUI();

      // Initialize Google 1-Click Sign-In
      this.initGoogleSignIn();

      // ==========================================================
      // 1-TIME BROWSER AUTHENTICATION: INSTANT BOOT (0ms Startup)
      // If this browser already has an authenticated session saved,
      // load INSTANTLY from localStorage without any loading spinner!
      // ==========================================================
      const cached = this.getCachedMetadata();
      if (cached && cached.user && cached.user.isAuthorized) {
        this.onMetadataLoaded(cached, true);
        // Silently sync & revalidate with server in the background
        this.syncMetadataInBackground();
        return;
      }

      // First time opening on this browser (or after browser data/cache cleared):
      const loaderMsg = document.getElementById('loader-message');
      if (loaderMsg) loaderMsg.textContent = "Verifying Google Account for this browser (1-time setup)...";

      // Check Google Apps Script runtime availability
      this.waitForGas();
    },

    waitForGas() {
      // Fast fallback to local cache if present
      const cached = this.getCachedMetadata();
      if (cached && cached.user && cached.user.isAuthorized) {
        this.onMetadataLoaded(cached, true);
        this.syncMetadataInBackground();
        return;
      }

      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        setTimeout(() => this.waitForGas(), 50);
      } else {
        this.loadAppMetadata();
      }
    },

    /** Calls backend to fetch authentication profile and initial metadata with offline fallback */
    loadAppMetadata() {
      const cached = this.getCachedMetadata();
      if (cached && cached.user && cached.user.isAuthorized) {
        this.onMetadataLoaded(cached, true);
        this.syncMetadataInBackground();
        return;
      }

      google.script.run
        .withSuccessHandler(data => this.onMetadataLoaded(data, false))
        .withFailureHandler(err => this.onMetadataFailed(err))
        .getAppMetadata(this.getAuthToken());
    },

    /**
     * Silently verifies account status and fetches updated classes/rosters in the background.
     * Never blocks the user or interrupts their workflow.
     */
    syncMetadataInBackground() {
      const runSync = () => {
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler(data => {
              if (data && data.user) {
                if (data.user.isAuthorized) {
                  // User is active and authorized. Silently refresh cache & live state
                  if (data.user.authToken) this.setAuthToken(data.user.authToken);
                  this.setCachedMetadata(data);
                  if (data.allRosters) {
                    this.setCachedRosters(data.allRosters);
                  }
                  this.state.currentUser = data.user;
                  this.state.classes = data.classes || [];
                  this.state.faculty = data.faculty || [];
                  this.state.config = data.config || {};

                  // Update header profile text & badges silently
                  const nameEl = document.getElementById('user-display-name');
                  const emailEl = document.getElementById('user-display-email');
                  const badge = document.getElementById('user-role-badge');
                  if (nameEl) nameEl.textContent = data.user.name || data.user.email;
                  if (emailEl) emailEl.textContent = data.user.email;
                  if (badge) {
                    badge.textContent = data.user.role.toUpperCase();
                    badge.className = data.user.role === 'Admin'
                      ? 'px-2.5 py-1 text-[11px] sm:text-xs font-bold rounded-full bg-purple-100 text-purple-700 border border-purple-200 flex-shrink-0'
                      : 'px-2.5 py-1 text-[11px] sm:text-xs font-bold rounded-full bg-blue-100 text-blue-700 border border-blue-200 flex-shrink-0';
                  }

                  // Update Admin tabs visibility if role elevated
                  if (data.user.role === 'Admin') {
                    document.querySelectorAll('.admin-only').forEach(el => el.classList.remove('hidden'));
                    this.renderPeriodScheduleEditor();
                  }

                  // Refresh dropdowns silently (preserving any class user already picked) and update offline readiness badge
                  this.populateClassDropdowns(true);
                  if (!this.state.manualPeriodSelected) {
                    const curDate = document.getElementById('mark-date-input') ? document.getElementById('mark-date-input').value : new Date().toLocaleDateString('en-CA');
                    this.renderPeriodOptions(curDate, true);
                  }
                  const markSelect = document.getElementById('mark-class-select');
                  if (!markSelect || !markSelect.value) {
                    this.updateMarkUnselectedStatus();
                  }
                } else {
                  // Admin revoked or deactivated access in the backend
                  this.clearCachedAuth();
                  this.setAuthToken('');
                  this.showUnauthorizedScreen({
                    email: data.user.email || '',
                    message: data.user.message || 'Your account access has been revoked by the Administrator.'
                  });
                }
              }
            })
            .withFailureHandler(err => {
              // Network lag, timeout, or offline: Keep working with cached authorization silently!
              console.warn("Background auth check deferred:", err);
            })
            .getAppMetadata(this.getAuthToken());
        } else {
          setTimeout(runSync, 200);
        }
      };

      // Slight debounce so initial instant paint is 100% fluid
      setTimeout(runSync, 400);
    },

    onMetadataLoaded(data, isFromOfflineCache = false) {
      document.getElementById('global-loader').classList.add('hidden');

      if (!data || !data.user || !data.user.isAuthorized) {
        // Fall back to offline cached profile before showing unauthorized
        if (!isFromOfflineCache) {
          const cached = this.getCachedMetadata();
          if (cached && cached.user && cached.user.isAuthorized) {
            this.onMetadataLoaded(cached, true);
            this.syncMetadataInBackground();
            return;
          }
        }

        const userObj = (data && data.user) ? data.user : {};
        this.showUnauthorizedScreen({
          email: userObj.email || '',
          message: userObj.message || '',
          isPermissionError: Boolean(userObj.isPermissionError)
        });
        return;
      }

      // Save token if passed
      if (data.user && data.user.authToken) {
        this.setAuthToken(data.user.authToken);
      }

      // Save to device local cache for future 1-click & offline sessions
      if (!isFromOfflineCache) {
        this.setCachedMetadata(data);
        if (data.allRosters) {
          this.setCachedRosters(data.allRosters);
        }
      } else if (data.allRosters && Object.keys(this.getCachedRosters()).length === 0) {
        this.setCachedRosters(data.allRosters);
      }

      // Authorization success
      this.state.currentUser = data.user;
      this.state.classes = data.classes || [];
      this.state.faculty = data.faculty || [];
      this.state.config = data.config || {};

      // Update Topbar Profile
      document.getElementById('user-display-name').textContent = data.user.name || data.user.email;
      document.getElementById('user-display-email').textContent = data.user.email;
      const badge = document.getElementById('user-role-badge');
      badge.textContent = data.user.role.toUpperCase();
      if (data.user.role === 'Admin') {
        badge.className = 'px-2.5 py-1 text-[11px] sm:text-xs font-bold rounded-full bg-purple-100 text-purple-700 border border-purple-200 flex-shrink-0';
        // Unlock Admin Tabs
        document.querySelectorAll('.admin-only').forEach(el => el.classList.remove('hidden'));
      } else {
        badge.className = 'px-2.5 py-1 text-[11px] sm:text-xs font-bold rounded-full bg-blue-100 text-blue-700 border border-blue-200 flex-shrink-0';
      }

      // Unhide Sign Out / Switch User Button
      const signoutBtn = document.getElementById('user-signout-btn');
      if (signoutBtn) signoutBtn.classList.remove('hidden');

      const cfg = data.config || {};
      if (cfg.collegeName) {
        const cTitle = document.getElementById('college-title');
        if (cTitle) cTitle.textContent = cfg.collegeName;
        const pCollege = document.getElementById('print-college-name');
        if (pCollege) pCollege.textContent = cfg.collegeName;
      }
      if (cfg.portalTitle) {
        const pSub = document.getElementById('portal-subtitle');
        if (pSub) pSub.textContent = cfg.portalTitle;
      }

      // Populate Settings Inputs
      const cInput = document.getElementById('config-college-name');
      const pInput = document.getElementById('config-portal-title');
      const mInput = document.getElementById('config-min-attendance');
      if (cInput) cInput.value = cfg.collegeName || '';
      if (pInput) pInput.value = cfg.portalTitle || '';
      if (mInput) mInput.value = cfg.minAttendance || 75;

      // Update Period Timetable & Date Display
      const curDate = document.getElementById('mark-date-input') ? document.getElementById('mark-date-input').value : new Date().toLocaleDateString('en-CA');
      this.updateDateDisplay(curDate);
      this.renderPeriodOptions(curDate, true);
      if (data.user && data.user.role === 'Admin') {
        this.renderPeriodScheduleEditor();
      }

      // Populate Class Dropdowns
      this.populateClassDropdowns();

      // Show App Shell
      const deniedView = document.getElementById('access-denied-view');
      if (deniedView) deniedView.classList.add('hidden');
      document.getElementById('nav-bar').classList.remove('hidden');
      document.getElementById('main-content').classList.remove('hidden');

      // Update Offline Indicators & Sync Pill
      this.updateOfflineUI();

      // Do NOT default Class to any class on startup; let the user choose explicitly
      try { localStorage.removeItem('attendance_class'); } catch (e) {}
      const markClassEl = document.getElementById('mark-class-select');
      if (markClassEl) {
        markClassEl.value = '';
      }
      this.state.students = [];
      this.state.attendanceRecords = {};
      this.renderMarkStudentTable();
      this.onMarkParameterChange();

      if (isFromOfflineCache) {
        if (!navigator.onLine) {
          this.showToast(`⚡ Working Offline: Using cached roster for ${data.user.name}`, 'warning');
        } else {
          this.showToast(`Welcome back, ${data.user.name}!`, 'info');
        }
      } else {
        this.showToast(`🎉 Verified as ${data.user.name} (${data.user.role}) — saved on this browser!`, 'success');
      }
    },

    onMetadataFailed(err) {
      // Check offline fallback before showing unauthorized screen
      const cached = this.getCachedMetadata();
      if (cached && cached.user && cached.user.isAuthorized) {
        this.onMetadataLoaded(cached, true);
        return;
      }

      document.getElementById('global-loader').classList.add('hidden');
      const errStr = (err ? err.toString() : '');
      const isPerm = errStr.includes('permission') || errStr.includes('document');

      // Attempt to retrieve active user email independently of spreadsheet access
      try {
        google.script.run
          .withSuccessHandler(email => {
            this.showUnauthorizedScreen({
              email: email || '',
              isPermissionError: isPerm,
              rawError: errStr
            });
          })
          .withFailureHandler(() => {
            this.showUnauthorizedScreen({
              email: '',
              isPermissionError: isPerm,
              rawError: errStr
            });
          })
          .getCurrentUserEmail();
      } catch (e) {
        this.showUnauthorizedScreen({
          email: '',
          isPermissionError: isPerm,
          rawError: errStr
        });
      }
    },

    /**
     * Renders an unmissable, high-importance authorization screen when an account is unauthorized or missing permissions.
     * Prevents blank white screens and clearly instructs the user to contact the Administrator.
     */
    showUnauthorizedScreen(options) {
      document.getElementById('global-loader').classList.add('hidden');
      const deniedView = document.getElementById('access-denied-view');
      if (deniedView) deniedView.classList.remove('hidden');

      const email = options.email || '';
      const emailInput = document.getElementById('emergency-email-input');
      if (emailInput && email && email.includes('@')) {
        emailInput.value = email;
      }
      const isMissingAccount = !email && !options.isPermissionError;

      // Automatically run system diagnostics to inspect exact server/session state
      this.runDiagnostics(email);

      // Render Google Sign-In button on the authorization screen
      this.initGoogleSignIn();

      // Update Topbar Profile so it never stays stuck on "Loading... Checking auth..."
      const nameElem = document.getElementById('user-display-name');
      const emailElem = document.getElementById('user-display-email');
      const badgeElem = document.getElementById('user-role-badge');
      if (nameElem) nameElem.textContent = email ? "Unauthorized User" : "Access Restricted";
      if (emailElem) emailElem.textContent = email || (options.isPermissionError ? "Drive Access Needed" : "No Google Account");
      if (badgeElem) {
        badgeElem.textContent = "UNAUTHORIZED";
        badgeElem.className = "px-2.5 py-1 text-[11px] sm:text-xs font-bold rounded-full bg-red-100 text-red-700 border border-red-300 flex-shrink-0";
      }

      const emailDisplay = document.getElementById('denied-user-email');
      const titleElem = document.getElementById('denied-title');
      const subtitleElem = document.getElementById('denied-subtitle');
      const msgBox = document.getElementById('denied-message-box');
      const switchBtn = document.getElementById('denied-switch-acc-btn');

      if (emailDisplay) emailDisplay.textContent = email || (options.isPermissionError ? 'Unregistered Google Account' : 'No Account Detected');

      if (switchBtn) {
        switchBtn.href = 'https://accounts.google.com/AccountChooser?continue=' + encodeURIComponent('https://script.google.com/macros/s/AKfycbxScxEhMYpky7FzhwwjQoaQw8StxkOJ9PAGysMxOme0OtRI7WaSlothNVc5vwud8HvX/exec');
      }

      if (isMissingAccount) {
        // No Google account session provided by browser - prompt for Email OTP
        if (titleElem) titleElem.textContent = "Faculty Sign-In";
        if (subtitleElem) subtitleElem.innerHTML = '<span class="text-blue-800 font-semibold bg-blue-100 px-3 py-1 rounded-full text-xs border border-blue-200">Department of Botany • Attendance Portal</span>';
        if (msgBox) {
          msgBox.innerHTML = `
            <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 text-xs sm:text-sm text-slate-800 space-y-2">
              <p class="font-bold text-blue-900 text-sm">One-Time Faculty Verification</p>
              <p>Enter your registered college email below and click <strong>"Send One-Time OTP"</strong> to verify your account. Once verified, this device will stay signed in for 1-click access.</p>
            </div>
          `;
        }
        const iconContainer = document.getElementById('denied-icon-container');
        if (iconContainer) {
          iconContainer.className = "w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-3.5 shadow-sm border border-blue-200";
        }
      } else if (options.isPermissionError) {
        // Google Drive permission error on the spreadsheet file
        if (titleElem) titleElem.textContent = "Google Drive Permission Required";
        if (subtitleElem) subtitleElem.innerHTML = 'Signed in as <strong class="text-amber-800 font-mono font-bold break-all bg-amber-50 px-2.5 py-0.5 rounded border border-amber-300">' + (email || 'Current Google Account') + '</strong>';
        if (msgBox) {
          msgBox.innerHTML = `
            <div class="bg-amber-50 border-2 border-amber-300 rounded-xl p-4 sm:p-5 text-xs sm:text-sm space-y-3">
              <div class="flex items-start gap-2.5 text-amber-900 font-bold text-sm sm:text-base">
                <span class="text-lg">📁</span>
                <span>Spreadsheet Access Required on Google Drive</span>
              </div>
              <p class="text-slate-700 leading-relaxed">
                Your Google account (<strong class="font-mono text-slate-900 font-bold">${email || 'this account'}</strong>) does not currently have permission to access the master Attendance spreadsheet on Google Drive.
              </p>
              <div class="bg-white p-4 rounded-xl border border-amber-200 space-y-2.5 text-xs shadow-sm">
                <p class="font-bold text-slate-800 text-sm">How to resolve:</p>
                <ul class="list-disc list-inside space-y-2 text-slate-700">
                  <li><strong>Multiple Google Accounts Signed In?</strong> If your phone or computer has multiple Google accounts, tap <strong>"Switch Google Account"</strong> below to select the exact account shared by the department.</li>
                  <li><strong>First Time Opening?</strong> Ask your Department Administrator / HOD to share the master Google Sheet with <strong class="font-mono text-slate-900">${email || 'your email'}</strong> as <strong>Editor</strong>.</li>
                </ul>
                <div class="p-3 bg-slate-50 rounded-lg border border-slate-200 text-xs text-slate-700 flex items-center gap-2">
                  <span>ℹ️</span>
                  <span>Once access is granted, tap <strong>"Refresh App"</strong> below.</span>
                </div>
              </div>
            </div>
          `;
        }
      } else {
        // User is signed in, but NOT AUTHORIZED on Users list
        if (titleElem) titleElem.textContent = "Access Restricted: Authorization Required";
        if (subtitleElem) subtitleElem.innerHTML = 'Signed in as <strong class="text-red-700 font-mono font-bold break-all bg-red-50 px-2.5 py-0.5 rounded border border-red-200">' + (email || 'an unregistered Google account') + '</strong>';
        if (msgBox) {
          msgBox.innerHTML = `
            <div class="bg-red-50 border-2 border-red-200 rounded-xl p-4 sm:p-5 text-xs sm:text-sm space-y-3">
              <div class="flex items-start gap-2.5 text-red-900 font-bold text-sm sm:text-base">
                <span class="text-lg">🛑</span>
                <span>You do not have permission to access the Attendance Portal</span>
              </div>
              <p class="text-slate-700 leading-relaxed">
                This portal is strictly restricted to authorized Faculty and Administrators of the <strong>Department of Botany</strong>.
                Your Google Account is currently not registered on the authorized user list.
              </p>
              
              <div class="bg-white p-4 rounded-xl border border-red-200 space-y-2.5 text-xs shadow-sm">
                <div class="flex items-center gap-1.5 text-red-900 font-bold uppercase tracking-wider text-[11px]">
                  <svg class="w-4 h-4 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                  <span>Action Required: Contact Administrator</span>
                </div>
                <p class="text-slate-700 leading-relaxed">
                  Please contact the Department Administrator / HOD to add your Google account (<strong class="font-mono text-slate-900 font-bold">${email || 'your email'}</strong>) in the <strong>Admin Panel</strong>.
                </p>
                <div class="p-3 bg-slate-50 rounded-lg border border-slate-200 text-xs text-slate-700 flex items-center gap-2">
                  <span>ℹ️</span>
                  <span>Once your access is approved by the HOD, tap <strong>"Refresh App"</strong> below to proceed.</span>
                </div>
              </div>
            </div>
          `;
        }
      }
    },

    populateClassDropdowns(preserveSelection = false) {
      const markSelect = document.getElementById('mark-class-select');
      const rosterManagerSelect = document.getElementById('roster-manager-class-select');
      const reportSelect = document.getElementById('report-class-select');
      const importExisting = document.getElementById('import-existing-class-select');
      const promoteSelect = document.getElementById('promote-source-class');
      const clearSelect = document.getElementById('clear-class-select');

      const prevValues = {};
      if (preserveSelection) {
        [markSelect, rosterManagerSelect, reportSelect, importExisting, promoteSelect, clearSelect].forEach(el => {
          if (el && el.id) prevValues[el.id] = el.value;
        });
      }

      const activeClasses = (this.state.classes || []).filter(c => c.status !== 'Archived');
      const archivedClasses = (this.state.classes || []).filter(c => c.status === 'Archived');

      // 1. Mark Attendance: Active classes only (never default-selected)
      if (markSelect) {
        let html = '<option value="" disabled selected>Select Class</option>';
        activeClasses.forEach(c => {
          html += `<option value="${c.classId}">${c.className}</option>`;
        });
        markSelect.innerHTML = html;

      // 6. Import Class: Shows New, Active, and Archived Classes for Re-use

    /* ==========================================================
       TAB 1: UNIFIED MARK & EDIT ATTENDANCE (TOUCH & MOBILE FIRST)
       ========================================================== */

    formatDateToDDMMYY(isoDate) {
      if (!isoDate) return '--/--/--';
      const parts = isoDate.split('-');
      if (parts.length === 3) {
        const yy = parts[0].slice(-2);
        const mm = parts[1].padStart(2, '0');
        const dd = parts[2].padStart(2, '0');
        return `${dd}/${mm}/${yy}`;
      }
      return isoDate;
    },

    getDayName(isoDate) {
      if (!isoDate) return '';
      const [y, m, d] = isoDate.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
      return days[dt.getDay()] || '';
    },

    formatTime12h(timeStr) {
      if (!timeStr) return '';
      const [hStr, mStr] = timeStr.split(':');
      let h = parseInt(hStr, 10);
      const m = mStr || '00';
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12;
      if (h === 0) h = 12;
      return `${h.toString().padStart(2, '0')}:${m} ${ampm}`;
    },

    updateDateDisplay(isoDate) {
      const display = document.getElementById('mark-date-display');
      const dayBadge = document.getElementById('mark-date-day-badge');
      if (display) display.textContent = this.formatDateToDDMMYY(isoDate);
      if (dayBadge) {
        const dayName = this.getDayName(isoDate);
        dayBadge.textContent = dayName;
        if (dayName === 'FRI') {
          dayBadge.className = 'text-[10px] font-bold px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800 uppercase flex-shrink-0';
        } else {
          dayBadge.className = 'text-[10px] font-bold px-1.5 py-0.5 rounded bg-blue-100 text-blue-800 uppercase flex-shrink-0';
        }
      }
    },

    onMarkDateChange(newIsoDate) {
      if (!newIsoDate) return;
      this.updateDateDisplay(newIsoDate);
      // When date changes, update period options (Friday vs Regular) and re-evaluate auto-period
      this.renderPeriodOptions(newIsoDate, true);
      this.onMarkParameterChange();
    },

    openDatePicker(event) {
      const input = document.getElementById('mark-date-input');
      if (!input) return;
      if (typeof input.showPicker === 'function') {
        try {
          input.showPicker();
          if (event && event.target !== input) {
            event.preventDefault();
          }
          return;
        } catch (err) {
          // Fall back to focus if showPicker throws
        }
      }
      input.focus();
    },

    setMarkDateToToday() {
      const today = new Date().toLocaleDateString('en-CA');
      const dateInput = document.getElementById('mark-date-input');
      if (dateInput) {
        dateInput.value = today;
        this.onMarkDateChange(today);
      }
    },

    shiftMarkDate(daysDelta) {
      const input = document.getElementById('mark-date-input');
      const currentVal = input && input.value ? input.value : new Date().toLocaleDateString('en-CA');
      const [y, m, d] = currentVal.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      dt.setDate(dt.getDate() + daysDelta);
      const newIso = dt.toLocaleDateString('en-CA');
      if (input) {
        input.value = newIso;
        this.onMarkDateChange(newIso);
      }
    },

    getPeriodSchedule() {
      if (this.state.config && this.state.config.periodSchedule && (this.state.config.periodSchedule.regular || this.state.config.periodSchedule.friday)) {
        return this.state.config.periodSchedule;
      }
      return DEFAULT_PERIOD_SCHEDULE;
    },

    getScheduleForDate(isoDate) {
      const schedule = this.getPeriodSchedule();
      if (!isoDate) return schedule.regular || DEFAULT_PERIOD_SCHEDULE.regular;
      const [y, m, d] = isoDate.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      const isFriday = dt.getDay() === 5;
      if (isFriday && schedule.friday && schedule.friday.length > 0) {
        return schedule.friday;
      }
      return schedule.regular || DEFAULT_PERIOD_SCHEDULE.regular;
    },

    getAutoPeriodForTime(isoDate, currentTime = new Date()) {
      const periods = this.getScheduleForDate(isoDate);
      if (!periods || periods.length === 0) return 'Period 1';

      // Minutes from midnight on device clock
      const curMinutes = currentTime.getHours() * 60 + currentTime.getMinutes();

      // 1. Check if current time falls within any period
      for (let i = 0; i < periods.length; i++) {
        const p = periods[i];
        const [sh, sm] = (p.startTime || '00:00').split(':').map(Number);
        const [eh, em] = (p.endTime || '00:00').split(':').map(Number);
        const startM = (sh || 0) * 60 + (sm || 0);
        const endM = (eh || 0) * 60 + (em || 0);

        if (curMinutes >= startM && curMinutes < endM) {
          return p.name;
        }
      }

      // 2. If before the first period, default to first period
      const [fsh, fsm] = (periods[0].startTime || '00:00').split(':').map(Number);
      const firstStartM = (fsh || 0) * 60 + (fsm || 0);
      if (curMinutes < firstStartM) {
        return periods[0].name;
      }

      // 3. If between periods (e.g. interval / lunch), pick upcoming period
      for (let i = 0; i < periods.length; i++) {
        const p = periods[i];
        const [sh, sm] = (p.startTime || '00:00').split(':').map(Number);
        const startM = (sh || 0) * 60 + (sm || 0);
        if (curMinutes < startM) {
          return p.name;
        }
      }

      // 4. If after all periods, default to last period of the day
      return periods[periods.length - 1].name;
    },

    renderPeriodOptions(selectedDate, autoSelect = false) {
      const periodSelect = document.getElementById('mark-period-select');
      if (!periodSelect) return;

      const periods = this.getScheduleForDate(selectedDate);
      const [y, m, d] = (selectedDate || '').split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      const isFriday = dt.getDay() === 5;

      const autoBadge = document.getElementById('period-auto-badge');
      if (autoBadge) {
        autoBadge.textContent = isFriday ? '🕌 Friday Schedule' : '⚡ Auto-Time Active';
        autoBadge.className = isFriday
          ? 'text-[10px] font-bold px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800 border border-emerald-300'
          : 'text-[10px] font-bold px-1.5 py-0.5 rounded bg-blue-50 text-blue-700 border border-blue-200';
      }

      const prevValue = periodSelect.value;
      let html = '<option value="" disabled>Select Period</option>';

      periods.forEach(p => {
        const timeLabel = (p.startTime && p.endTime)
          ? ` (${this.formatTime12h(p.startTime)} – ${this.formatTime12h(p.endTime)})`
          : '';
        html += `<option value="${p.name}">${p.name}${timeLabel}</option>`;
      });

      periodSelect.innerHTML = html;

      // Decide selection
      const todayIso = new Date().toLocaleDateString('en-CA');
      const isToday = selectedDate === todayIso;

      if (autoSelect || !prevValue || isToday) {
        const targetPeriod = this.getAutoPeriodForTime(selectedDate, new Date());
        periodSelect.value = targetPeriod;
      } else if (periods.some(p => p.name === prevValue)) {
        periodSelect.value = prevValue;
      } else {
        periodSelect.value = periods[0] ? periods[0].name : 'Period 1';
      }
    },

    onMarkPeriodChange(newPeriod) {
      this.state.manualPeriodSelected = true;
      this.onMarkParameterChange();
    },

    startPeriodClock() {
      // Runs every 60 seconds to auto-update the period dropdown if viewing today and user hasn't manually overridden
      setInterval(() => {
        const dateInput = document.getElementById('mark-date-input');
        const periodSelect = document.getElementById('mark-period-select');
        if (!dateInput || !periodSelect) return;

        const todayIso = new Date().toLocaleDateString('en-CA');
        if (dateInput.value === todayIso && !this.state.manualPeriodSelected) {
          const autoPeriod = this.getAutoPeriodForTime(todayIso, new Date());
          if (periodSelect.value !== autoPeriod) {
            periodSelect.value = autoPeriod;
            this.onMarkParameterChange();
            console.log(`⏰ Period auto-updated to ${autoPeriod} based on device time.`);
          }
        }
      }, 60000);
    },

    onMarkClassChange(classId) {
      this.state.activeSessionKey = '';
      this.state.isExistingSession = false;
      this.state.existingSession = null;
      if (!classId) {
        this.state.students = [];
        this.state.attendanceRecords = {};
        this.renderMarkStudentTable();
        this.onMarkParameterChange();
        return;
      }

      // Clear search query so previous filters do not inadvertently hide students
      const searchInput = document.getElementById('mark-student-search');
      if (searchInput) {
        searchInput.value = '';
      }

      // Ensure date is set to today if empty
      const dateInput = document.getElementById('mark-date-input');
      if (dateInput && !dateInput.value) {
        const todayIso = new Date().toLocaleDateString('en-CA');
        dateInput.value = todayIso;
        this.updateDateDisplay(todayIso);
      }

      // Ensure period is populated if empty (do not override manual selection)
      const periodSelect = document.getElementById('mark-period-select');
      if (periodSelect && !periodSelect.value) {
        const curDate = dateInput ? dateInput.value : '';
        const autoPeriod = this.getAutoPeriodForTime(curDate, new Date());
        periodSelect.value = autoPeriod;
      }

      // 1. Instant Render from LocalStorage Cache (Offline-First)
      const cachedRosters = this.getCachedRosters();
      const cachedMeta = this.getCachedMetadata();
      const cachedList = (cachedRosters && cachedRosters[classId])
        || (cachedMeta && cachedMeta.allRosters && cachedMeta.allRosters[classId])
        || null;
      const hasCached = Array.isArray(cachedList) && cachedList.length > 0;

      if (hasCached) {
        this.state.students = cachedList.map(s => Object.assign({}, s));
        this.state.attendanceRecords = {};
        this.state.students.forEach(s => {
          const key = s.studentId || s.regNo;
          this.state.attendanceRecords[key] = 'P';
        });

        this.renderMarkStudentTable();
        if (!navigator.onLine) {
          const statusText = document.getElementById('mark-roster-status-text');
          if (statusText) {
            statusText.innerHTML += ' <span class="ml-1.5 px-1.5 py-0.5 text-[10px] font-bold bg-amber-100 text-amber-800 rounded border border-amber-200">📱 Offline Cache</span>';
          }
        }
        this.onMarkParameterChange();
      } else if (!navigator.onLine) {
        this.state.students = [];
        this.state.attendanceRecords = {};
        const container = document.getElementById('mark-student-list-container');
        if (container) {
          container.innerHTML = `<div class="p-8 text-center text-amber-600 font-medium text-xs sm:text-sm">⚡ Offline Mode: Student roster for this class is not in the device cache yet.</div>`;
        }
        const statusText = document.getElementById('mark-roster-status-text');
        if (statusText) statusText.innerHTML = '<span class="text-amber-600 font-semibold">⚠️ Offline: Class roster not cached</span>';
        this.updateMarkCounters();
        this.onMarkParameterChange();
        return;
      } else {
        const container = document.getElementById('mark-student-list-container');
        container.innerHTML = `<div class="p-8 text-center text-blue-600 font-medium text-xs sm:text-sm">Loading class roster...</div>`;
        const statusText = document.getElementById('mark-roster-status-text');
        if (statusText) statusText.innerHTML = '<span class="text-blue-600 font-medium animate-pulse">Loading class roster...</span>';
      }

      // 2. If online, asynchronously verify and refresh cache from Google Apps Script
      if (navigator.onLine && typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(students => {
            if (students && students.length > 0) {
              // Update local cache regardless of whether user switched class
              const rosters = this.getCachedRosters();
              rosters[classId] = students;
              this.setCachedRosters(rosters);

              const curClass = document.getElementById('mark-class-select') ? document.getElementById('mark-class-select').value : '';
              if (curClass !== classId) return;

              this.state.students = students;

              if (!hasCached) {
                this.state.attendanceRecords = {};
                this.state.students.forEach(s => {
                  const key = s.studentId || s.regNo;
                  this.state.attendanceRecords[key] = 'P';
                });
                this.renderMarkStudentTable();
                this.onMarkParameterChange();
              }
            }
          })
          .withFailureHandler(err => {
            const curClass = document.getElementById('mark-class-select') ? document.getElementById('mark-class-select').value : '';
            if (!hasCached && curClass === classId) {
              const container = document.getElementById('mark-student-list-container');
              if (container) {
                container.innerHTML = `<div class="p-8 text-center text-rose-500 font-medium text-xs sm:text-sm">Unable to load students (connection lost).</div>`;
              }
              const statusText = document.getElementById('mark-roster-status-text');
              if (statusText) statusText.textContent = 'Connection unavailable while loading roster.';
              this.showToast(`Error loading students: ${err}`, 'error');
            }
          })
          .getStudentsByClass(classId);
      }
    },

    resetMarkAttendanceToPresent(shouldRender = true) {
      if (!this.state.students) return;
      this.state.students = this.state.students.filter(s => !s.isInactive);
      this.state.attendanceRecords = {};
      this.state.students.forEach(s => {
        const key = s.studentId || s.regNo;
        this.state.attendanceRecords[key] = 'P';
      });
      if (shouldRender) this.renderMarkStudentTable();
    },

    onMarkParameterChange() {
      const classId = document.getElementById('mark-class-select').value;
      const date = document.getElementById('mark-date-input').value;
      const period = document.getElementById('mark-period-select').value;
      const banner = document.getElementById('session-status-banner');

      if (!classId || !date || !period) {
        if (banner) banner.classList.add('hidden');
        this.state.activeSessionKey = '';
        this.state.isExistingSession = false;
        this.state.existingSession = null;
        this.setSubmitButtonMode(false);
        return;
      }

      const sessionKey = `${classId}|${date}|${period}`;
      const isSameSessionContext = (this.state.activeSessionKey === sessionKey);
      this.state.activeSessionKey = sessionKey;

      // Check Local Offline Queue First!
      const offlineQueue = this.getOfflineQueue();
      const queuedSession = offlineQueue.find(q => q.classId === classId && q.date === date && q.period === period);
      if (queuedSession) {
        this.state.isExistingSession = true;
        this.state.existingSession = queuedSession;

        if (queuedSession.subject) {
          document.getElementById('mark-subject-input').value = queuedSession.subject;
        }

        if (this.state.students && queuedSession.records) {
          queuedSession.records.forEach(r => {
            const key = r.studentId || r.regNo;
            this.state.attendanceRecords[key] = r.status || 'P';
          });
        }

        if (banner) {
          const timeStr = queuedSession.savedAt ? new Date(queuedSession.savedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
          banner.className = "mt-3.5 p-3 sm:p-3.5 rounded-xl border border-amber-300 bg-amber-50 text-amber-900 text-xs sm:text-sm shadow-sm flex items-center justify-between";
          banner.innerHTML = `
            <div class="flex items-center space-x-2 min-w-0">
              <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-amber-200 text-amber-900 border border-amber-300 flex-shrink-0">⚡ Saved in Local Offline Queue</span>
              <span class="text-xs text-slate-700 truncate">Saved locally on this device at <strong>${timeStr}</strong></span>
            </div>
            <span class="text-[10px] text-amber-900 font-extrabold uppercase bg-amber-200 px-2.5 py-1 rounded-full flex-shrink-0">Pending Sync</span>
          `;
          banner.classList.remove('hidden');
        }

        this.setSubmitButtonMode(true, true);
        this.renderMarkStudentTable();
        return;
      }

      // If offline and not in queue: reset only when switching session context so unsaved taps survive network drops
      if (!navigator.onLine) {
        if (!isSameSessionContext || this.state.isExistingSession) {
          this.state.isExistingSession = false;
          this.state.existingSession = null;
          this.resetMarkAttendanceToPresent(true);
        }
        if (banner) {
          banner.className = "mt-3.5 p-3 rounded-xl border border-amber-300 bg-amber-50 text-amber-900 text-xs flex items-center space-x-2";
          banner.innerHTML = `<span class="text-amber-600 font-bold text-sm">⚡</span><span class="font-medium">Offline Mode: Mark attendance as usual. It will be saved securely to this device.</span>`;
          banner.classList.remove('hidden');
        }
        this.setSubmitButtonMode(false, true);
        return;
      }

      // When changing period/date or leaving a loaded existing session, reset cleanly before querying server
      if (!isSameSessionContext || this.state.isExistingSession) {
        this.state.isExistingSession = false;
        this.state.existingSession = null;
        this.resetMarkAttendanceToPresent(true);
      }

      if (banner) {
        banner.className = "mt-3.5 p-3 rounded-xl border border-blue-200 bg-blue-50/80 text-blue-900 text-xs flex items-center space-x-2";
        banner.innerHTML = `<div class="animate-spin rounded-full h-3.5 w-3.5 border-2 border-blue-600 border-t-transparent flex-shrink-0"></div><span class="font-medium">Checking attendance records for this period...</span>`;
        banner.classList.remove('hidden');
      }

      google.script.run
        .withSuccessHandler(res => {
          // Stale response guard: ensure current UI selections still match this query
          const curClass = document.getElementById('mark-class-select') ? document.getElementById('mark-class-select').value : '';
          const curDate = document.getElementById('mark-date-input') ? document.getElementById('mark-date-input').value : '';
          const curPeriod = document.getElementById('mark-period-select') ? document.getElementById('mark-period-select').value : '';
          if (curClass !== classId || curDate !== date || curPeriod !== period) {
            return;
          }

          if (res && res.success) {
            // Existing session found! Pre-populate saved attendance
            this.state.isExistingSession = true;
            this.state.existingSession = res.session;

            if (res.session.subject) {
              document.getElementById('mark-subject-input').value = res.session.subject;
            }

            // If sessionStudents returned, include past students (even if deleted/inactive)
            if (res.students && res.students.length > 0) {
              this.state.students = res.students;
            }

            if (this.state.students && res.statusMap) {
              this.state.students.forEach(s => {
                const key = s.studentId || s.regNo;
                this.state.attendanceRecords[key] = res.statusMap[key] || res.statusMap[s.regNo] || 'P';
              });
            }

            if (banner) {
              banner.className = "mt-3.5 p-3 sm:p-3.5 rounded-xl border border-amber-300 bg-amber-50 text-amber-900 text-xs sm:text-sm shadow-sm";
              banner.innerHTML = `
                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2">
                  <div class="flex items-center space-x-2 min-w-0">
                    <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-amber-200 text-amber-900 border border-amber-300 flex-shrink-0">⚡ Previous Session Loaded</span>
                    <span class="text-xs text-slate-700 truncate">Recorded by <strong>${res.session.facultyEmail || 'Faculty'}</strong>${res.session.lastEditedBy ? ` • Last updated by ${res.session.lastEditedBy}` : ''}</span>
                  </div>
                  <span class="text-[11px] text-amber-800 font-semibold bg-amber-100 px-2 py-0.5 rounded flex-shrink-0">Editing In-Place</span>
                </div>
              `;
              banner.classList.remove('hidden');
            }

            this.setSubmitButtonMode(true, false);
            this.renderMarkStudentTable();
          } else {
            // New Session (active students already reset before lookup; preserve any taps made while checking)
            this.state.isExistingSession = false;
            this.state.existingSession = null;

            if (banner) {
              banner.className = "mt-3.5 p-3 sm:p-3.5 rounded-xl border border-emerald-200 bg-emerald-50 text-emerald-900 text-xs sm:text-sm";
              banner.innerHTML = `
                <div class="flex items-center space-x-2">
                  <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-300 flex-shrink-0">🟢 New Attendance Session</span>
                  <span class="text-xs text-slate-600">No previous attendance for this period. All students defaulted to Present (P).</span>
                </div>
              `;
              banner.classList.remove('hidden');
            }

            this.setSubmitButtonMode(false, false);
          }
        })
        .withFailureHandler(err => {
          const curClass = document.getElementById('mark-class-select') ? document.getElementById('mark-class-select').value : '';
          const curDate = document.getElementById('mark-date-input') ? document.getElementById('mark-date-input').value : '';
          const curPeriod = document.getElementById('mark-period-select') ? document.getElementById('mark-period-select').value : '';
          if (curClass !== classId || curDate !== date || curPeriod !== period) {
            return;
          }
          if (banner) {
            banner.className = "mt-3.5 p-3 rounded-xl border border-amber-300 bg-amber-50 text-amber-900 text-xs flex items-center space-x-2";
            banner.innerHTML = `<span class="text-amber-600 font-bold text-sm">⚡</span><span class="font-medium">Offline/Unreachable: Attendance will be saved to this device's local queue.</span>`;
            banner.classList.remove('hidden');
          }
          this.setSubmitButtonMode(false, true);
        })
        .getSessionForEditing(classId, date, period, this.getAuthToken());
    },

    setSubmitButtonMode(isExisting, isOffline = false) {
      const btn = document.getElementById('mark-submit-btn');
      if (!btn) return;
      btn.disabled = false;
      const offline = isOffline || !navigator.onLine;

      if (offline) {
        btn.className = "px-5 py-3 sm:px-6 sm:py-2.5 bg-amber-600 active:bg-amber-800 text-white font-bold rounded-xl shadow-md hover:bg-amber-700 transition disabled:opacity-50 disabled:cursor-not-allowed flex items-center space-x-2 text-xs sm:text-sm";
        btn.innerHTML = `
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
          <span>${isExisting ? 'Update in Offline Queue' : 'Save to Offline Queue'}</span>
        `;
      } else if (isExisting) {
        btn.className = "px-5 py-3 sm:px-6 sm:py-2.5 bg-emerald-600 active:bg-emerald-800 text-white font-bold rounded-xl shadow-md hover:bg-emerald-700 transition disabled:opacity-50 disabled:cursor-not-allowed flex items-center space-x-2 text-xs sm:text-sm";
        btn.innerHTML = `
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
          <span>Save Attendance Changes</span>
        `;
      } else {
        btn.className = "px-5 py-3 sm:px-6 sm:py-2.5 bg-blue-600 active:bg-blue-800 text-white font-bold rounded-xl shadow-md hover:bg-blue-700 transition disabled:opacity-50 disabled:cursor-not-allowed flex items-center space-x-2 text-xs sm:text-sm";
        btn.innerHTML = `
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
          </svg>
          <span>Submit Attendance</span>
        `;
      }
    },

    updateMarkUnselectedStatus() {
      const statusText = document.getElementById('mark-roster-status-text');
      if (!statusText) return;
      const activeClasses = (this.state.classes || []).filter(c => c.status !== 'Archived');
      const cachedRosters = this.getCachedRosters() || {};
      const cachedMeta = this.getCachedMetadata();
      const metaRosters = (cachedMeta && cachedMeta.allRosters) ? cachedMeta.allRosters : {};

      let cachedClassCount = 0;
      let cachedStudentCount = 0;
      activeClasses.forEach(c => {
        const list = cachedRosters[c.classId] || metaRosters[c.classId];
        if (Array.isArray(list) && list.length > 0) {
          cachedClassCount++;
          cachedStudentCount += list.length;
        }
      });

      if (cachedClassCount > 0) {
        if (!navigator.onLine) {
          statusText.innerHTML = `<span class="text-amber-700 font-semibold">⚡ Offline Ready: ${cachedClassCount}/${activeClasses.length} classes (${cachedStudentCount} students) cached on device. Select a class above.</span>`;
        } else {
          statusText.innerHTML = `Select a class above &bull; <span class="text-emerald-700 font-semibold">${cachedClassCount}/${activeClasses.length} classes (${cachedStudentCount} students) ready offline</span>`;
        }
      } else {
        statusText.textContent = 'Select a class above to load enrolled students.';
      }
    },

    renderMarkStudentTable(filterQuery = '') {
      const container = document.getElementById('mark-student-list-container');
      const markSelect = document.getElementById('mark-class-select');
      const selectedClassId = markSelect ? markSelect.value : '';
      if (!selectedClassId) {
        container.innerHTML = `<div class="p-8 text-center text-slate-400 text-xs sm:text-sm">👈 Please select a class above to take attendance.</div>`;
        this.updateMarkCounters();
        this.updateMarkUnselectedStatus();
        return;
      }

      if (!this.state.students || this.state.students.length === 0) {
        container.innerHTML = `<div class="p-8 text-center text-slate-400 text-xs sm:text-sm">No students enrolled in this class.</div>`;
        this.updateMarkCounters();
        return;
      }

      const q = filterQuery.toLowerCase().trim();
      const filtered = this.state.students.filter(s =>
        (s.regNo || '').toLowerCase().includes(q) ||
        (s.name || '').toLowerCase().includes(q) ||
        (s.rollNo || '').toString().toLowerCase().includes(q)
      );

      if (filtered.length === 0) {
        container.innerHTML = `<div class="p-8 text-center text-slate-400 text-xs sm:text-sm">No matching students found.</div>`;
        return;
      }

      let html = '';
      filtered.forEach(s => {
        const key = s.studentId || s.regNo;
        const status = this.state.attendanceRecords[key] || 'P';
        html += `
        <div class="flex items-center justify-between p-3 sm:p-4 hover:bg-slate-50 transition border-b border-slate-100 last:border-b-0 gap-2 w-full overflow-hidden" id="row-${key}">
          <!-- Left: Reg No badge, Roll No, Student Name, Dept badge, Inactive badge, Edit button -->
          <div class="flex-1 min-w-0 pr-1">
            <div class="flex items-center space-x-1.5 flex-wrap">
              <span class="text-[11px] font-mono font-bold text-slate-800 bg-slate-100 px-1.5 py-0.5 rounded border border-slate-200 flex-shrink-0">${s.regNo}</span>
              ${s.rollNo ? `<span class="text-[11px] text-slate-400 font-mono flex-shrink-0">#${s.rollNo}</span>` : ''}
              ${s.department ? `<span class="text-[10px] font-semibold text-purple-700 bg-purple-50 px-1.5 py-0.5 rounded border border-purple-200 flex-shrink-0" title="Home Department">${s.department}</span>` : ''}
              ${s.isInactive ? `<span class="text-[10px] font-semibold text-slate-500 bg-slate-100 px-1.5 py-0.5 rounded border border-slate-300 flex-shrink-0" title="Student has been removed from active class roster">Inactive (Past Record)</span>` : ''}
              <button type="button" onclick="app.openEditStudentModal('${key}')" title="Edit student record"
                class="text-slate-400 hover:text-blue-600 p-0.5 text-xs transition inline-flex items-center flex-shrink-0">
                ✏️
              </button>
            </div>
            <div class="text-xs sm:text-sm font-semibold text-slate-900 truncate mt-0.5">
              ${s.name} ${s.isInactive ? '<span class="text-[11px] text-slate-400 font-normal">(Past Record)</span>' : ''}
            </div>
          </div>

          <!-- Right: Tactile 3-State Button Group (P, A, L) -->
          <div class="flex-shrink-0">
            <div class="inline-flex rounded-xl shadow-sm border border-slate-200 overflow-hidden bg-white">
              ${this.renderStatusBtn(key, 'P', status, 'P')}
              ${this.renderStatusBtn(key, 'A', status, 'A')}
              ${this.renderStatusBtn(key, 'L', status, 'L')}
            </div>
          </div>
        </div>
      `;
      });

      container.innerHTML = html;
      this.updateMarkCounters();

      const statusText = document.getElementById('mark-roster-status-text');
      if (statusText && this.state.students) {
        const total = this.state.students.length;
        const first = this.state.students[0];
        if (total > 0 && first) {
          statusText.innerHTML = `Enrolled: <strong class="text-slate-900 font-bold">${total} students</strong> &bull; #1: <strong class="text-blue-700 font-bold font-mono">${first.regNo}</strong> <span class="text-slate-800 font-semibold">(${first.name})</span> #${first.rollNo || '1'}`;
        } else {
          statusText.textContent = 'No students enrolled in this class.';
        }
      }
    },

    renderStatusBtn(regNo, value, currentStatus, label) {
      const isActive = value === currentStatus;
      const activeClass = isActive ? `status-${value}-active` : 'bg-white text-slate-600 hover:bg-slate-100';
      return `
      <button type="button" onclick="app.setStudentStatus('${regNo}', '${value}')" 
        class="status-btn px-2.5 sm:px-3 text-xs font-bold border-r last:border-r-0 border-slate-200 transition ${activeClass}">
        ${label}
      </button>
    `;
    },

    setStudentStatus(regNo, status) {
      this.state.attendanceRecords[regNo] = status;
      const row = document.getElementById(`row-${regNo}`);
      if (row) {
        const buttons = row.querySelectorAll('.status-btn');
        buttons.forEach(btn => {
          const text = btn.textContent.trim();
          const isActive = text === status;
          btn.className = `status-btn px-2.5 sm:px-3 text-xs font-bold border-r last:border-r-0 border-slate-200 transition ${isActive ? `status-${text}-active` : 'bg-white text-slate-600 hover:bg-slate-100'
            }`;
        });
      }
      this.updateMarkCounters();
    },

    markAll(status) {
      if (!this.state.students) return;
      this.state.students.forEach(s => {
        const key = s.studentId || s.regNo;
        this.state.attendanceRecords[key] = status;
      });
      this.renderMarkStudentTable();
    },

    invertAttendance() {
      if (!this.state.students) return;
      this.state.students.forEach(s => {
        const key = s.studentId || s.regNo;
        const cur = this.state.attendanceRecords[key] || 'P';
        this.state.attendanceRecords[key] = (cur === 'P') ? 'A' : 'P';
      });
      this.renderMarkStudentTable();
    },

    filterStudentList(query) {
      this.renderMarkStudentTable(query);
    },

    updateMarkCounters() {
      let p = 0, a = 0, l = 0, total = 0;
      if (this.state.students) {
        total = this.state.students.length;
        Object.values(this.state.attendanceRecords).forEach(st => {
          if (st === 'P') p++;
          else if (st === 'A') a++;
          else if (st === 'L') l++;
        });
      }
      document.getElementById('mark-count-total').textContent = total;
      document.getElementById('mark-count-present').textContent = p;
      document.getElementById('mark-count-absent').textContent = a;
      document.getElementById('mark-count-late').textContent = l;
    },

    submitAttendance() {
      const classId = document.getElementById('mark-class-select').value;
      const date = document.getElementById('mark-date-input').value;
      const period = document.getElementById('mark-period-select').value;
      const subject = document.getElementById('mark-subject-input').value;

      if (!classId || !date || !period) {
        this.showToast("Please fill Class, Date, and Period before saving.", "error");
        return;
      }
      if (!this.state.students || this.state.students.length === 0) {
        this.showToast("No students to save for this class.", "error");
        return;
      }

      const records = this.state.students.map(s => {
        const key = s.studentId || s.regNo;
        return {
          studentId: s.studentId || key,
          regNo: s.regNo,
          status: this.state.attendanceRecords[key] || 'P'
        };
      });

      const payload = {
        classId,
        date,
        period,
        subject,
        records,
        authToken: this.getAuthToken(),
        facultyEmail: (this.state.currentUser && this.state.currentUser.email) ? this.state.currentUser.email : ''
      };

      // 1. If currently offline, immediately save to LocalStorage Offline Queue!
      if (!navigator.onLine) {
        this.saveSessionToOfflineQueue(payload);
        return;
      }

      // 2. If online, attempt to save to Google Sheets
      const btn = document.getElementById('mark-submit-btn');
      btn.disabled = true;
      btn.innerHTML = `<span>Saving...</span>`;

      google.script.run
        .withSuccessHandler(res => {
          btn.disabled = false;
          if (res.success) {
            this.showToast(res.message, 'success');
            // Remove from offline queue if it was previously queued
            const queue = this.getOfflineQueue().filter(q => !(q.classId === classId && q.date === date && q.period === period));
            this.setOfflineQueue(queue);
            this.onMarkParameterChange();
          } else {
            this.showToast(res.message, 'error');
            this.setSubmitButtonMode(this.state.isExistingSession);
          }
        })
        .withFailureHandler(err => {
          btn.disabled = false;
          console.warn("GAS save failed, falling back to offline queue:", err);
          // Network failed during transmission: save safely to offline queue
          this.saveSessionToOfflineQueue(payload);
          this.showToast(`Connection interrupted. Saved safely to Offline Queue on this device!`, 'warning');
        })
        .recordAttendanceSession(payload);
    },

    /* ==========================================================
       TAB 3: REPORTS & ANALYTICS (DESKTOP & MOBILE VIEWS)
       ========================================================== */

    generateReport() {
      const classId = document.getElementById('report-class-select').value;
      const fromDate = document.getElementById('report-from-date').value;
      const toDate = document.getElementById('report-to-date').value;

      if (!classId) {
        this.showToast("Please choose a class to view report.", "error");
        return;
      }

      const btn = document.getElementById('report-generate-btn');
      btn.disabled = true;
      btn.innerHTML = `<span>Generating...</span>`;

      google.script.run
        .withSuccessHandler(res => {
          btn.disabled = false;
          btn.innerHTML = `<span>Generate Report</span>`;

          if (!res.success) {
            this.showToast(res.message, 'error');
            return;
          }

          this.state.activeReportData = res;

          // Populate KPIs
          document.getElementById('kpi-total-sessions').textContent = res.totalSessions;
          document.getElementById('kpi-average-attendance').textContent = res.averageAttendance;
          document.getElementById('kpi-shortage-count').textContent = res.belowThresholdCount;

          document.getElementById('report-kpi-container').classList.remove('hidden');
          document.getElementById('report-table-card').classList.remove('hidden');

          // Populate Desktop Table
          const tbody = document.getElementById('report-table-body');
          let tableHtml = '';

          // Populate Mobile Card List
          const mobileContainer = document.getElementById('report-mobile-card-list');
          let mobileHtml = '';

          res.rows.forEach(r => {
            const threshold = res.minThreshold || (this.state.config && this.state.config.minAttendance) || 75;
            const isShortage = r.numericPercentage < threshold;
            const pctClass = isShortage ? 'text-rose-600 font-bold' : 'text-emerald-600 font-semibold';
            const badgeClass = isShortage ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700';

            tableHtml += `
            <tr class="hover:bg-slate-50 transition">
              <td class="px-4 py-3 font-mono font-medium text-slate-700">${r.regNo}</td>
              <td class="px-6 py-3 font-semibold text-slate-900">
                ${r.name}
                ${r.isInactive ? '<span class="ml-1 text-[10px] font-semibold text-slate-500 bg-slate-100 px-1.5 py-0.5 rounded border border-slate-300">Inactive</span>' : ''}
              </td>
              <td class="px-4 py-3 text-xs text-slate-600">${r.department ? `<span class="px-2 py-0.5 text-[11px] font-medium bg-purple-50 text-purple-700 rounded-full border border-purple-200">${r.department}</span>` : '<span class="text-slate-300">-</span>'}</td>
              <td class="px-4 py-3 text-center text-emerald-600 font-medium">${r.present}</td>
              <td class="px-4 py-3 text-center text-amber-600 font-medium">${r.late}</td>
              <td class="px-4 py-3 text-center text-rose-600 font-medium">${r.absent}</td>
              <td class="px-4 py-3 text-center text-slate-600 font-medium">${r.totalHours}</td>
              <td class="px-6 py-3 text-center font-mono text-base ${pctClass}">${r.percentage}</td>
            </tr>
          `;

            mobileHtml += `
            <div class="p-3.5 flex items-center justify-between">
              <div>
                <div class="flex items-center space-x-1.5 flex-wrap">
                  <span class="text-[11px] font-mono text-slate-500 font-semibold">${r.regNo}</span>
                  ${r.department ? `<span class="text-[10px] font-semibold text-purple-700 bg-purple-50 px-1.5 py-0.5 rounded border border-purple-200">${r.department}</span>` : ''}
                  ${r.isInactive ? '<span class="text-[10px] font-semibold text-slate-500 bg-slate-100 px-1 py-0.5 rounded border border-slate-300">Inactive</span>' : ''}
                </div>
                <div class="text-xs sm:text-sm font-bold text-slate-900">${r.name}</div>
                <div class="text-[11px] text-slate-500 mt-0.5">
                  Attended: <strong class="text-slate-800">${r.present + r.late}</strong> / ${r.totalHours} hrs
                </div>
              </div>
              <div class="text-right">
                <span class="px-2.5 py-1 text-xs font-bold rounded-lg font-mono ${badgeClass}">${r.percentage}</span>
              </div>
            </div>
          `;
          });

          tbody.innerHTML = tableHtml;
          mobileContainer.innerHTML = mobileHtml;
        })
        .withFailureHandler(err => {
          btn.disabled = false;
          btn.innerHTML = `<span>Generate Report</span>`;
          this.showToast(`Report generation error: ${err}`, 'error');
        })
        .getAttendanceReport({ classId, fromDate, toDate }, this.getAuthToken());
    },

    exportReportToExcel() {
      if (!this.state.activeReportData) return;
      const data = this.state.activeReportData;
      const excelRows = data.rows.map(r => ({
        "Register No": r.regNo,
        "Student Name": r.name + (r.isInactive ? " (Inactive)" : ""),
        "Home Department": r.department || "",
        "Present Hours": r.present,
        "Late Hours": r.late,
        "Absent Hours": r.absent,
        "Total Sessions": r.totalHours,
        "Attendance Percentage": r.percentage
      }));

      const ws = XLSX.utils.json_to_sheet(excelRows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Attendance Summary");

      const fileName = `${data.classId}_Attendance_Report.xlsx`;
      XLSX.writeFile(wb, fileName);
      this.showToast(`Exported ${fileName}`, 'success');
    },

    printOfficialReport() {
      if (!this.state.activeReportData) return;
      const data = this.state.activeReportData;

      const metaHeader = document.getElementById('print-meta-header');
      metaHeader.textContent = `Class: ${data.classId} | Total Hours Conducted: ${data.totalSessions} | Date: ${new Date().toLocaleDateString()}`;

      const printTbody = document.getElementById('print-table-body');
      let html = '';
      data.rows.forEach(r => {
        html += `
        <tr>
          <td class="border border-black px-2 py-1 font-mono">${r.regNo}</td>
          <td class="border border-black px-2 py-1">${r.name}${r.isInactive ? ' (Inactive)' : ''}</td>
          <td class="border border-black px-2 py-1 text-xs">${r.department || '-'}</td>
          <td class="border border-black px-2 py-1 text-center">${r.present}</td>
          <td class="border border-black px-2 py-1 text-center">${r.late}</td>
          <td class="border border-black px-2 py-1 text-center">${r.absent}</td>
          <td class="border border-black px-2 py-1 text-center">${r.totalHours}</td>
          <td class="border border-black px-2 py-1 text-center font-bold">${r.percentage}</td>
        </tr>
      `;
      });
      printTbody.innerHTML = html;

      window.print();
    },

    openMatrixRegisterModal() {
      if (!this.state.activeReportData) {
        this.showToast("Please generate a report first.", "error");
        return;
      }
      const data = this.state.activeReportData;
      if (!data.sessions || data.sessions.length === 0) {
        this.showToast("No recorded attendance sessions found for this class and date range.", "error");
        return;
      }

      this.state.matrixOrientation = this.state.matrixOrientation || 'landscape';
      this.updateMatrixOrientationUI();
      this.renderMatrixPreview();
      document.getElementById('matrix-register-modal').classList.remove('hidden');
    },

    closeMatrixRegisterModal() {
      document.getElementById('matrix-register-modal').classList.add('hidden');
    },

    setMatrixOrientation(orientation) {
      this.state.matrixOrientation = orientation;
      this.updateMatrixOrientationUI();
      this.renderMatrixPreview();
    },

    updateMatrixOrientationUI() {
      const isLandscape = (this.state.matrixOrientation || 'landscape') === 'landscape';
      const btnLand = document.getElementById('matrix-btn-landscape');
      const btnPort = document.getElementById('matrix-btn-portrait');

      if (btnLand && btnPort) {
        if (isLandscape) {
          btnLand.className = "px-3 py-1.5 rounded-md font-bold text-xs transition bg-white text-indigo-700 shadow-sm";
          btnPort.className = "px-3 py-1.5 rounded-md font-bold text-xs transition text-slate-600 hover:text-slate-900";
        } else {
          btnPort.className = "px-3 py-1.5 rounded-md font-bold text-xs transition bg-white text-indigo-700 shadow-sm";
          btnLand.className = "px-3 py-1.5 rounded-md font-bold text-xs transition text-slate-600 hover:text-slate-900";
        }
      }
    },

    renderMatrixPreview() {
      const data = this.state.activeReportData;
      if (!data || !data.sessions) return;

      const orientation = this.state.matrixOrientation || 'landscape';
      const chunkSize = orientation === 'portrait' ? 10 : 18;
      const sessions = data.sessions;
      const chunks = [];

      for (let i = 0; i < sessions.length; i += chunkSize) {
        chunks.push(sessions.slice(i, i + chunkSize));
      }
      if (chunks.length === 0) chunks.push([]);

      const chunkInfoEl = document.getElementById('matrix-chunk-info');
      if (chunkInfoEl) {

    formatRegisterDate(dStr) {
      if (!dStr) return '';
      if (/^\d{4}-\d{2}-\d{2}$/.test(dStr)) {
        const parts = dStr.split('-');
        return `${parts[2]}/${parts[1]}`;
      }
      if (/^\d{2}-\d{2}-\d{4}$/.test(dStr)) {
        const parts = dStr.split('-');
        return `${parts[0]}/${parts[1]}`;
      }
      return dStr;
    },

    formatRegisterPeriod(pStr) {
      if (!pStr) return '';
      const match = pStr.match(/\d+/);
      if (match) return `P${match[0]}`;
      return pStr;
    },

    printMatrixRegister() {
      if (!this.state.activeReportData) return;
      const orientation = this.state.matrixOrientation || 'landscape';

      let styleEl = document.getElementById('matrix-page-style');
      if (!styleEl) {
        styleEl = document.createElement('style');
        styleEl.id = 'matrix-page-style';
        document.head.appendChild(styleEl);
      }
      styleEl.innerHTML = `
        @page {
          size: ${orientation};
          margin: 8mm;
        }
        @media print {
          .matrix-page-block {
            page-break-after: always;
            break-after: page;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
            margin-bottom: 0 !important;
          }
          .matrix-page-block:last-child {
            page-break-after: avoid;
            break-after: avoid;
          }
        }
      `;

      document.body.classList.add('printing-matrix');
      window.print();
      setTimeout(() => {
        document.body.classList.remove('printing-matrix');

    },

    downloadMatrixPdfDirect() {
      if (!this.state.activeReportData) return;
      const data = this.state.activeReportData;
      const orientation = this.state.matrixOrientation || 'landscape';

      const btn = document.getElementById('matrix-direct-download-btn');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `
          <svg class="animate-spin w-4 h-4 mr-1 text-white inline" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
          </svg>
          <span>Generating PDF...</span>
        `;
      }

      const restoreBtn = () => {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
            </svg>
            <span>Download PDF</span>
          `;
        }
      };

      const filter = {
        classId: data.classId,
        fromDate: data.fromDate || '',
        toDate: data.toDate || '',
        orientation: orientation
      };

      google.script.run
        .withSuccessHandler(res => {
          restoreBtn();
          if (!res.success) {
            this.showToast(res.message || "Failed to generate PDF.", "error");
            return;
          }

          try {
            const byteCharacters = atob(res.base64);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) {
              byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);
            const blob = new Blob([byteArray], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = res.filename || 'Attendance_Register.pdf';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            this.showToast(`Downloaded ${res.filename}`, "success");
          } catch (e) {
            console.error("PDF download blob error:", e);
            this.showToast("Error processing PDF file download.", "error");
          }
        })
        .withFailureHandler(err => {
          restoreBtn();
          this.showToast("Server error generating PDF: " + err, "error");
        })
        .downloadRegisterPdf(filter, this.getAuthToken());
    },
